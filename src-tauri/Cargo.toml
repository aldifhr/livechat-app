[package]
name = "livechat-app"
version = "0.1.0"
description = "TikTok live chat viewer"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Reached only from here: the webview's content security policy forbids it from
# talking to any host but the app's own origin, which is the right shape for an
# API key that must not end up in the page.
reqwest = { version = "0.12", features = ["json"] }
# The backend's event stream. Opened from here rather than from the webview for
# the same reason as reqwest: the page's content security policy keeps it from
# reaching any other origin, and a feed URL is not something a page should hold.
#
# native-tls, not rustls: reqwest above takes native-tls by default, and asking
# rustls here put two TLS stacks in one process with rustls carrying no crypto
# provider. rustls resolves its provider at the first handshake and panics when it
# cannot, which is a crash on connect rather than an error anyone could read.
# One stack means one trust store and nothing to install at startup. On Windows
# both end up on Schannel, the same implementation the webview already trusts.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio = { version = "1", features = ["time"] }
# Already in the tree through reqwest and Tauri; pulled in directly because the
# socket is read through the `Stream` interface.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
