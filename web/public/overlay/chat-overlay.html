<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live chat overlay</title>
<!--
  One file, on purpose.

  This page is loaded by OBS, not by a person: it is fetched once when a source is
  added and then left alone for the length of a stream. Everything it needs is
  inline for that reason — a second request is a second thing that can be slow,
  and a page that is still arriving is a page showing nothing on someone's stream.

  What it deliberately does not do is talk to the desktop app. It resolves the
  handle itself and opens its own socket to the StreamKit backend, so it works
  whether or not the app is running, and the app is only involved in building the
  URL.

  This file is the only copy. The backend serves it over HTTP and the desktop host
  embeds the very same file with include_str!, which is why it lives here and not
  under src-tauri/: the backend is deployed to a VPS with only the backend/
  directory, so this is the half that has to stand alone. Do not add a second
  copy — that is what let the two versions drift apart once already, with OBS and
  the app serving different overlays and no test failing over it.
-->
<style>
  :root {
    /* Replaced from the query string. Every one has a default here as well, so a
       bare URL renders something rather than nothing. */
    --size: 22px;
    --name-colour: #ffd76a;
    --text-colour: #ffffff;
    --background: 0;
    --font: "Segoe UI", system-ui, sans-serif;
    --align: flex-end;
  }

  * { box-sizing: border-box; }

  /* A backdrop, for when this page is being *shown* rather than composited.
     `html` and `body` are transparent on purpose — this page is drawn over video,
     and in OBS the pixels behind it are the scene. A browser paints an opaque
     base behind a transparent document regardless, so on its own this page in a
     preview frame is a white rectangle with light text on it: precisely the
     combination the colours are picked to be legible against.
     `?backdrop=dark` puts something there. It is opt-in per request, so the OBS
     browser source — which is asked for this page with no such parameter, and
     must stay transparent — is unaffected. */
  html.stage-backdrop { background: #141414; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    /* OBS composites the source, so the page must not have an opaque body of its
       own or the video behind it disappears. */
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: var(--align);
    align-items: flex-start;
    /* In `em` rather than the fixed 24px it was: the canvas is a fixed number of
       pixels but the text is not, and 24px is a hair's breadth on a 1080p source
       and a visible border on a 720p one. */
    padding: 1em;
    font-family: var(--font);
    font-size: var(--size);
    line-height: 1.3;
  }

  /* The list grows from the aligned edge, so `justify-content` on the body is
     enough to pin it to the bottom, the top, or either side. */
  #chat {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.25em;
    /* A column, not a field. `max-width: 100%` on its own meant one long message
       could run the whole width of a 1920px canvas — a single thin line the width
       of the screen, which is the hardest shape there is to read. In `em`, so it
       follows `--size`: one column stays one column whatever the text is set to,
       and at the 22px default this is a little under half the canvas. */
    max-width: min(100%, 34em);
    /* Faded at the top, which is where the old messages are.
       This list is pinned to the bottom of the canvas and messages are appended,
       so the newest is always the last line and the ones above it are the ones
       about to be pushed off. Fading the bottom instead — which is the edge new
       messages arrive at, and the first thing to try — makes the newest message
       the faintest thing on screen, which is the one anybody is reading.

       A mask rather than a gradient on the text: one declaration, no per-message
       opacity, and nothing to keep in step when the list changes. */
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000 26%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000 26%);
  }

  li {
    /* A backdrop rather than a box behind the whole list: a solid panel over a
       stream reads as a dialog box, and most overlays want the video visible
       behind the text. Set by `?bg=`, and off unless asked for. */
    background: rgba(0, 0, 0, var(--background));
    border-radius: 0.25em;
    padding: 0.1em 0.35em;
    /* A hint of outline rather than a drop shadow: a shadow is invisible on a
       bright scene, and this reads on any of them. */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 0.9);
    /* Long messages wrap rather than run off the edge of the source. */
    overflow-wrap: anywhere;
  }

  .name {
    color: var(--name-colour);
    font-weight: 700;
    /* Clickable, so it reads as a link — the one thing on a chat a viewer wants to
       follow up on. Underlined on hover only, so a resting chat is not a page of
       blue links. */
    text-decoration: none;
    cursor: pointer;
  }

  .name:hover { text-decoration: underline; }

  .text { color: var(--text-colour); }

  /* A gift row. Its own colour and a diamond badge, so the money that just arrived
     is the thing the eye lands on — distinct from the chat it sits among. */
  li.gift {
    color: var(--gift-colour, #ffd76a);
    font-weight: 700;
  }

  li.gift .name { color: var(--gift-colour, #ffd76a); }

  .gift-text { color: var(--text-colour); font-weight: 400; }

  .gift-diamonds {
    margin-left: 0.4em;
    padding: 0 0.35em;
    border-radius: 4px;
    background: rgba(255, 215, 106, 0.18);
    color: var(--gift-colour, #ffd76a);
    font-weight: 700;
  }

  /* Newest at the bottom. The app's feed does the same, and a chat that grows
     downwards is one a viewer reads the way they read every other chat. */
  #chat { justify-content: flex-end; }

  /* Old messages fade rather than vanish, so the row above a new one does not
     blink out of existence in the middle of being read. */
  li { transition: opacity 400ms ease; }
  li.fading { opacity: 0; }
  li.entering { animation: rise 260ms ease-out; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.4em); }
    to   { opacity: 1; transform: none; }
  }

  /* No motion asked for: no animation, and no fade. The rows still appear and
     still expire, they just do it all at once. */
  @media (prefers-reduced-motion: reduce) {
    li { transition: none; animation: none; }
    li.fading { display: none; }
  }

  /* A connection problem is the one thing this page must not announce. A red box
     in the corner of somebody's stream is worse than no chat at all, so failures
     are silent by default and `?debug=1` is how you go looking for them.

     The exception is a link with no handle in it. That is not a transient
     failure, it is a link that was built wrong, and the only way it can reach a
     stream is if somebody pasted it into OBS without checking — which is exactly
     when they need to see it. It shows before anything has been received and is
     gone the instant a real message arrives. */
  #status { display: none; }
  body.debug #status {
    display: block;
    position: fixed;
    top: 4px;
    left: 4px;
    font: 11px/1.4 ui-monospace, monospace;
    color: #ff8a80;
    background: rgba(0, 0, 0, 0.6);
    padding: 2px 6px;
    border-radius: 4px;
    max-width: 90vw;
    overflow-wrap: anywhere;
  }

  #unconfigured {
    display: none;
    color: #ffffff;
    opacity: 0.6;
    font-size: var(--size);
  }
  body.unconfigured #unconfigured { display: block; }
  /* Anything real, and it goes away. */
  body.ready #unconfigured { display: none; }

  /* A reply: text that opens with @someone.

     A message beginning with an @ is a person answering a person, and in a fast
     chat that is worth seeing before reading the words — it is who is being
     talked to, which is the context. The mention is split into its own span so it
     can carry the accent and a little weight, and the rest of the message follows
     it plainly. Clickable, like a name, because a mention you can act on is the
     one thing that makes it worth styling separately.

     The chip behind it is what makes the marker survive a colour choice. The
     name colour is the operator's, and an operator who sets it to white — which
     is the common choice — would otherwise have a mention that is the same white
     as the message around it, so the reply marker would vanish exactly when the
     chat got busy enough to need it. A neutral translucent pill is always visible
     against video and never collides with the text colour. */
  .mention {
    color: var(--name-colour);
    font-weight: 600;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 0.05em 0.45em;
  }

  .mention a {
    color: inherit;
  }

  /* A preview of the whole page while the socket is still resolving, so the
     source is not a blank rectangle for the first second of a stream. Hidden as
     soon as anything real arrives. */
  body:not(.ready):not(.unconfigured) #chat::after {
    content: "connecting…";
    color: #ffffff;
    opacity: 0.35;
    font-size: var(--size);
  }
</style>
</head>
<body>
<ul id="chat" aria-live="polite" aria-relevant="additions"></ul>
<div id="unconfigured">no handle in this link — add <code>?room=yourhandle</code></div>
<div id="status"></div>

<script>
(function () {
  'use strict'

  // ---- configuration -------------------------------------------------------

  // Baked in by the host at request time. Every key can be overridden by the
  // query string, and the query string wins — that is what lets a link be edited
  // by hand and what makes the URL an honest description of what is on screen.
  var baked = (function () {
    try { return JSON.parse(document.getElementById('overlay-config').textContent) || {} }
    catch (e) { return {} }
  })()

  var query = new URLSearchParams(location.search)

  function param(name, fallback) {
    var found = query.get(name)
    return found === null || found === '' ? fallback : found
  }

  function number(name, fallback, min, max) {
    var given = param(name, '')
    // An absent parameter is not a number and must fall back, not clamp. The trap
    // is `Number('') === 0`: 0 is finite, so an `isFinite` check alone passes it
    // through and then clamps it up to `min` — which is how a link with no `size`
    // ended up rendering at the 8px floor instead of the 22px default. An empty
    // string is treated as absent before it is ever a number.
    if (given === '') return fallback
    var raw = Number(given)
    // `Number('wide')` is NaN, and a NaN row count renders every row. Anything
    // that is not a finite number is not a configuration.
    if (!isFinite(raw)) return fallback
    return Math.min(max, Math.max(min, raw))
  }

  // Baked values, read once. The backend writes the room's saved styling in here
  // when the link names a room by id, so a bare `?room=<id>` link renders as the
  // configured overlay with nothing in the URL. The query string still wins over
  // these, which is what lets a link be edited by hand.
  var bakedSize = baked.size, bakedName = baked.nameColour, bakedColor = baked.textColour
  var bakedBg = baked.background, bakedMax = baked.max, bakedDelay = baked.delay, bakedFont = baked.font

  var config = {
    // Defaults to this page's own origin. The page and its websocket are served
    // by the same vhost, so an overlay link names one host and nothing has to be
    // rewritten to work; `base` is still honoured for a page hosted elsewhere.
    baseUrl: String(param('base', baked.baseUrl || location.origin)).replace(/\/+$/, ''),
    username: String(param('room', baked.username || '')).replace(/^@/, '').trim(),
    size: number('size', typeof bakedSize === 'number' ? bakedSize : 22, 8, 96),
    nameColour: param('name', bakedName || '#ffd76a'),
    textColour: param('color', bakedColor || '#ffffff'),
    // 0 is no backdrop at all, so the video shows straight through; 1 is a solid
    // panel behind each line. A value in 0..1 rather than a percentage, because
    // "0.35" reads more clearly than "35%" beside a slider.
    background: number('bg', typeof bakedBg === 'number' ? bakedBg : 0, 0, 1),
    max: Math.round(number('max', typeof bakedMax === 'number' ? bakedMax : 8, 1, 50)),
    // How long between one message appearing and the next.
    //
    // A floor rather than a setting with a right answer: at a fifth of a second a
    // busy room keeps up and reads as fast enough; at two seconds a single message
    // sits alone for an age before anything follows it. The value is read once
    // here rather than per message, so a badly chosen number cannot retime a
    // message already on screen.
    delay: number('delay', typeof bakedDelay === 'number' ? bakedDelay : 500, 120, 3000),
    font: param('font', bakedFont || '"Segoe UI", system-ui, sans-serif'),
    debug: param('debug', '') !== ''
  }

  // This page's own styling defaults, with no URL and no baked config involved.
  //
  // Needed because a pushed style is the room's *whole* style rather than a patch,
  // so a key the push leaves out means "back to default" — not "keep whatever it
  // was". Without this, clearing a room's saved styling left the overlay on the
  // old values: there was no way to un-style a stream once it had been styled.
  var STYLE_DEFAULTS = {
    size: 22,
    nameColour: '#ffd76a',
    textColour: '#ffffff',
    // The same 0 the `config` literal above falls back to, and deliberately so:
    // this object and that literal are two copies of one question — what does an
    // un-styled overlay look like — and they were answering it differently. This
    // was 0.05, so an overlay opened with the video straight through it and then
    // grew a faint scrim the first time the backend pushed a style for a room
    // whose saved config carried no `bg`. Both are now 0, and
    // `test-overlay-sync.mjs` holds them together.
    background: 0,
    max: 8,
    delay: 500,
    font: '"Segoe UI", system-ui, sans-serif'
  }

  // Push the current styling onto the page.
  //
  // A function rather than four lines at the top because it now runs twice: once
  // for whatever the URL or the baked config said when this loaded, and again every
  // time the backend pushes a new style. Setting these four custom properties is
  // enough — they are what every rule in the page reads — so a restyle does not
  // touch the DOM, does not reconnect, and does not disturb a message that is
  // already on screen.
  function applyConfig() {
    document.documentElement.style.setProperty('--size', config.size + 'px')
    document.documentElement.style.setProperty('--name-colour', config.nameColour)
    document.documentElement.style.setProperty('--text-colour', config.textColour)
    document.documentElement.style.setProperty('--font', config.font)
    // The background goes behind each line and nowhere else. It used to be applied
    // to the page itself as well, at 60% of this value — which meant the slider the
    // streamer was dragging was labelled "background" and was doing two things: the
    // row scrim it names, at full value, and a tint over the whole source at 0.6 of
    // it, which nobody asked for and which darkened the video behind the chat. One
    // setting, one thing it does.
    document.documentElement.style.setProperty('--background', String(config.background))
  }

  applyConfig()

  var status = document.getElementById('status')

  function say(message) {
    // Only ever visible under `?debug=1`. The failure mode of an overlay is
    // shown to a stream full of people, so silence is the default and this is how
    // you ask for the truth.
    if (!config.debug) return
    document.body.classList.add('debug')
    status.textContent = message
  }

  // ---- the feed ------------------------------------------------------------

  var list = document.getElementById('chat')

  /**
   * Reports the rendered height of the chat to whoever embedded this page.
   *
   * The overlay itself is a fixed rectangle in OBS — that is what a browser
   * source IS — and its own `overflow: hidden` is deliberate there: content that
   * does not fit is content the operator chose not to size the source for.
   *
   * The dashboard's preview is a different thing. It has no size of its own to
   * honour; it is a window onto this page, and when it is shorter than the chat
   * it clips the top rows with no scrollbar and no error. So the height is
   * reported and the preview grows to it.
   *
   * Measured on the list rather than the body: the body is always the full
   * height of the frame, because `html, body { height: 100% }`, and it would
   * report the frame's own height back rather than the chat's.
   */
  // A backdrop is asked for, not taken. See the `stage-backdrop` rule: this page
  // is composited over video in OBS and has to stay transparent there, and a
  // preview frame cannot provide the video — so it asks for a stand-in instead.
  if (param('backdrop', '') === 'dark') {
    document.documentElement.classList.add('stage-backdrop')
  }

  function reportHeight() {
    try {
      parent.postMessage({ streamkitHeight: list.scrollHeight + 48 }, '*')
    } catch (error) {}
  }

  new ResizeObserver(reportHeight).observe(list)
  window.addEventListener('load', reportHeight)

  /**
   * Messages waiting to be shown, and whether one is on its way in.
   *
   * A queue rather than rendering each frame as it lands, because a room under
   * load arrives faster than anyone reads. Rendered straight through, the last
   * eight messages stack up in a tenth of a second and the viewer sees a wall —
   * which is what a chat looks like on a phone, and is unreadable on a stream
   * where it is competing with whatever is actually happening. Shown one at a
   * time, the same eight arrive as eight readable beats.
   *
   * So: incoming messages go on the queue, and `pump` releases one every
   * `config.delay`. The first is released the moment it arrives rather than after
   * a delay, because there is nothing to pace it against — the room was silent.
   */
  var queue = []
  var showing = false

  /**
   * How far behind the room the overlay is allowed to get.
   *
   * A queue with no cap is a slow-motion recording of a busy room: at a half
   * second each, a backlog of forty is a message appearing twenty seconds after
   * it was said, which is not a message about anything any more. Past this the
   * oldest waiting ones are dropped — they are the stalest, and showing a quarter
   * of a minute old chat is worse than not showing it.
   */
  var MAX_QUEUE = 20

  function enqueue(user, text, userId) {
    queue.push({ user: user, text: text, userId: userId })
    if (queue.length > MAX_QUEUE) queue.splice(0, queue.length - MAX_QUEUE)
    pump()
  }

  function pump() {
    if (showing) return
    var next = queue.shift()
    if (!next) return
    showing = true
    render(next.user, next.text, next.userId)
    setTimeout(function () {
      showing = false
      pump()
    }, config.delay)
  }

  /**
  /**
   * A name from a chat row, turned into a TikTok username.
   *
   * A leading `@` is dropped, because it is how a handle is written when typed and
   * never part of the username. An `@` anywhere else becomes `_`, because a
   * display name is what a row falls back to when the wire carries no handle, and a
   * display name can read `gmd@me` for someone whose handle is `gmd_me` — while a
   * TikTok username can only be letters, digits, `_` and `.`. Percent-encoding the
   * `@` instead produced a link to an account that cannot exist, which reads as a
   * dead account rather than as a bug.
   */
  function tiktokUsername(raw) {
    return String(raw == null ? '' : raw).trim().replace(/^@+/, '').replace(/@/g, '_')
  }

  /**
   * The name, as a link to the viewer's TikTok profile.
   *
   * Clickable because a name on a stream is the one thing a viewer wants to follow
   * up on — who said that, who sent that gift — and a chat where the name is dead
   * text answers none of it. Opens in a new tab; the overlay itself is not
   * navigated away from, because it is a browser source that has to keep showing.
   *
   * `userId` is TikTok's stable handle for the person when the wire carries one,
   * and the display name is the fallback. Built from the handle, not the display
   * name, because the display name is not always a valid profile path.
   */
  function nameLink(user, userId) {
    var who = String(user == null ? '' : user).trim() || 'Someone'
    var handle = String(userId == null ? '' : userId).trim()
    var link = document.createElement('a')
    link.className = 'name'
    link.textContent = who
    var path = tiktokUsername(handle || who)
    link.href = 'https://www.tiktok.com/@' + encodeURIComponent(path)
    link.target = '_blank'
    link.rel = 'noopener noreferrer'
    link.title = 'Open @' + path + ' on TikTok'
    return link
  }

  /**
   * A mention, as a link to the mentioned viewer's TikTok profile.
   *
   * Takes a bare handle (no leading @), because the @ is the caller's markup, not
   * part of the name. Kept separate from `nameLink` because the two answer
   * different questions: `nameLink` has to choose between a handle and a display
   * name, and a mention always carries a handle — a display name with a space
   * could never be typed as `@someone` in the first place.
   */
  function mentionLink(handle) {
    var link = document.createElement('a')
    var path = tiktokUsername(handle)
    link.href = 'https://www.tiktok.com/@' + encodeURIComponent(path)
    link.target = '_blank'
    link.rel = 'noopener noreferrer'
    link.title = 'Open @' + path + ' on TikTok'
    link.textContent = '@' + handle
    return link
  }

  /**
   * Split a message into a leading @mention and the rest, if it opens with one.
   *
   * A message that begins with @someone is a reply, and the mention is the whole
   * point of reading it as one — it says who is being answered before the words
   * do. Only a mention at the very start counts: an @ in the middle of a sentence
   * is a word, not an address, and highlighting those would just be noise.
   *
   * The handle is TikTok's username shape (letters, digits, dot, underscore), so
   * "hey @bob" does not match — there is a space — and "email@host" does not match
   * because it does not begin the string. Returns null when there is no mention,
   * so the caller renders the plain path unchanged.
   */
  function splitMention(body) {
    var match = /^@([A-Za-z0-9._]{1,24})(?=\s|$)/.exec(body)
    if (!match) return null
    return { handle: match[1], rest: body.slice(match[0].length) }
  }

  function render(user, text, userId) {
    var body = String(text == null ? '' : text).trim()
    if (body === '') return

    var row = document.createElement('li')
    row.className = 'entering'

    row.appendChild(nameLink(user, userId))
    row.appendChild(document.createTextNode(': '))

    var message = document.createElement('span')
    message.className = 'text'

    var mention = splitMention(body)
    if (mention) {
      // The mention as its own element, linked like a name so it is something you
      // can act on rather than just coloured text.
      var tag = document.createElement('span')
      tag.className = 'mention'
      tag.appendChild(mentionLink(mention.handle))
      message.appendChild(tag)
      // The remainder after the mention, unchanged. Trimmed so the row does not
      // open with the gap that sat between the @handle and the words.
      var rest = mention.rest.trim()
      if (rest !== '') message.appendChild(document.createTextNode(' ' + rest))
    } else {
      message.textContent = body
    }

    row.appendChild(message)

    list.appendChild(row)
    document.body.classList.add('ready')

    trim()
    reportHeight()
  }

  /**
   * A gift, shown as its own kind of row.
   *
   * Not paced through the chat queue and not retired on the chat's schedule: a
   * gift is an event, not a message in a conversation, and the whole point of
   * showing it is that a viewer sees who gave what. Rendered at once, in the gift
   * colour, with the diamond count — the money that just arrived, which is the one
   * thing on a stream everyone looks up for.
   */
  function renderGift(user, giftName, count, value, userId) {
    var who = String(user == null ? '' : user).trim() || 'Someone'
    var row = document.createElement('li')
    row.className = 'entering gift'

    row.appendChild(nameLink(user, userId))

    var said = document.createElement('span')
    said.className = 'gift-text'
    var n = Number(count) || 1
    said.textContent = ' sent ' + (String(giftName || 'a gift')) + (n > 1 ? ' x' + n : '')
    row.appendChild(said)

    var diamonds = Number(value) || 0
    if (diamonds > 0) {
      var badge = document.createElement('span')
      badge.className = 'gift-diamonds'
      badge.textContent = diamonds.toLocaleString() + ' ◆'
      row.appendChild(badge)
    }

    list.appendChild(row)
    document.body.classList.add('ready')
    trim()
    reportHeight()
  }

  /**
   * Keeps the list at its limit.
   *
   * Counting only the rows that have not started to leave, and retiring from a
   * snapshot rather than off `firstElementChild`. Both of those are load-bearing.
   *
   * `retire` does not remove a row, it marks it: the row fades for 400ms and is
   * taken out of the tree after. So a `while` loop over `list.children.length`
   * never sees the number go down — it retires the same first child for ever,
   * `retire` returns early each time because the row is already marked, and the
   * page hangs inside the handler on the first message past the limit. Nothing
   * after that is ever rendered, which reads as the chat simply stopping.
   *
   * Iterating a list of the live rows makes the loop's progress visible in its
   * own body: each pass shifts one row off and retires it, so the count goes down
   * by one however slow the removal is.
   */
  /**
   * How many gift rows stay on screen at once.
   *
   * Larger than the chat limit, and counted separately from it: a gift is the one
   * thing a viewer looks up for, and it should outlast the chat that arrives after
   * it rather than being pushed off by the next few messages. Three is enough to
   * show a run of gifts without the list becoming a leaderboard.
   */
  var GIFT_KEEP = 3

  function trim() {
    var live = []
    var gifts = []
    for (var i = 0; i < list.children.length; i++) {
      var row = list.children[i]
      if (row.dataset.leaving === '1') continue
      live.push(row)
      if (row.classList.contains('gift')) gifts.push(row)
    }
    // Chat rows go first, oldest first, so the list stays at its limit. A gift is
    // only retired once the gifts alone exceed their own keep-count, which is what
    // lets one sit on screen through a stretch of ordinary chat.
    var chatCount = live.length - gifts.length
    var over = chatCount - (config.max - gifts.length)
    for (var i = 0; i < live.length && over > 0; i++) {
      if (live[i].classList.contains('gift')) continue
      retire(live[i])
      over--
    }
    // Then the oldest gifts, if there are more of them than are worth keeping.
    while (gifts.length > GIFT_KEEP) retire(gifts.shift())
  }

  function retire(row) {
    if (!row || row.dataset.leaving === '1') return

    // A backlog check before fading anything. Rows leave after their transition,
    // so a burst — a reconnect delivering what it missed, say — can mark far more
    // rows leaving than the screen is meant to hold, and for as long as the fade
    // runs the list carries all of them. Past a couple in flight the extra ones
    // are taken out at once: they are already below what anyone is reading, and
    // nobody sees them go.
    var inFlight = 0
    for (var i = 0; i < list.children.length; i++) {
      if (list.children[i].dataset.leaving === '1') inFlight++
    }
    if (inFlight >= 2) {
      if (row.parentNode) row.parentNode.removeChild(row)
      return
    }

    row.dataset.leaving = '1'
    row.classList.add('fading')
    // Removed after the transition has run, with a ceiling: under
    // `prefers-reduced-motion` the transition is `display: none`, and a removal
    // that waits on an event which never fires would leave the row in the tree
    // for ever, where `trim` counts it as live.
    var removed = false
    function drop() {
      if (removed) return
      removed = true
      if (row.parentNode) row.parentNode.removeChild(row)
    }
    // `transitionend` bubbles, so a transition on anything inside the row would
    // otherwise arrive here and remove it before its own fade had started.
    row.addEventListener('transitionend', function (event) {
      if (event.target === row) drop()
    })
    setTimeout(drop, 800)
  }

  // ---- the connection ------------------------------------------------------

  // Two steps, because the app has to do the same two: name a handle, get a room
  // id. There is no route that hands out a room id for a username, and inventing
  // one here would mean the app and the overlay could disagree about which room
  // they are watching.
  function socketFor(base, roomId) {
    var url = base.replace(/^http/, 'ws') + '/ws/overlay/' + encodeURIComponent(roomId)
    return new WebSocket(url)
  }

  // A room id, as opposed to a handle. Recognised by shape — eight, four, four,
  // four, twelve hex digits with dashes — because the backend mints ids in exactly
  // that form and a handle can never contain a dash-run like it. Passing a room id
  // straight through skips the resolve step: the link already names the room, so
  // there is no handle to turn into one, and a link that is just `?room=<id>` is
  // one nothing has to look up first.
  function looksLikeRoomId(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value)
  }

  function connect() {
    if (config.username === '') {
      // Said out loud, unlike everything below. This one is a wrong link rather
      // than a failed connection, and a streamer testing the link before a stream
      // is looking at a blank rectangle with no way to tell it apart from a
      // working one that has simply not seen a message yet.
      document.body.classList.add('unconfigured')
      say('no handle — add ?room=yourhandle to the URL')
      return
    }
    document.body.classList.remove('unconfigured')

    // Already a room id: open it directly. No handle to resolve, no request to
    // make, and the link stays a bare `?room=<id>`.
    if (looksLikeRoomId(config.username)) {
      open(config.username)
      return
    }

    fetch(config.baseUrl + '/api/room-connect-by-username', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: config.username })
    })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status)
        return response.json()
      })
      .then(function (room) {
        if (!room || !room.room_id) throw new Error('no room id in the answer')
        open(room.room_id)
      })
      .catch(function (error) {
        say('could not resolve ' + config.username + ': ' + error.message)
        // The backend may be restarting, or the network may be briefly down.
        // Retrying on a fixed beat is right here: there is no user to press
        // anything, and an overlay that gives up is an overlay that stays gone.
        setTimeout(connect, 5000)
      })
  }

  function open(roomId) {
    var socket
    try {
      socket = socketFor(config.baseUrl, roomId)
    } catch (error) {
      say('bad backend URL: ' + error.message)
      setTimeout(connect, 5000)
      return
    }

    socket.onopen = function () {
      say('connected to ' + config.username)
    }

    socket.onmessage = function (event) {
      var frame
      try {
        frame = JSON.parse(event.data)
      } catch (error) {
        return
      }
      if (!frame) return
      // A new style for this room, pushed the moment it is saved. Merged into the
      // live config rather than replacing it: the frame carries styling only, and
      // `baseUrl` and `username` came from the URL this page was opened with. A
      // replace would blank the overlay's connection as soon as somebody nudged a
      // slider.
      if (frame.type === 'config' && frame.config) {
        // Reset first, then apply. The frame is the room's whole style, so a key
        // it does not carry reverts rather than persisting from the last one.
        // A room with no saved styling sends an empty frame. That is not a
        // request to go back to defaults — it is the absence of a request — and
        // acting on it would strip the styling from any link that carried its own
        // parameters, which is what every link did before styling could be saved.
        // Un-styling is done by saving actual defaults, which is what the editor's
        // Reset button does.
        if (Object.keys(frame.config).length === 0) return

        Object.keys(STYLE_DEFAULTS).forEach(function (key) {
          config[key] = STYLE_DEFAULTS[key]
        })
        Object.keys(frame.config).forEach(function (key) {
          if (frame.config[key] !== undefined && frame.config[key] !== null) {
            config[key] = frame.config[key]
          }
        })
        applyConfig()
        say('style updated')
        return
      }
      // A gift is shown at once, not paced through the chat queue: it is an event,
      // not a message in a conversation, and holding it behind twenty queued
      // comments would bury the one thing everyone looks up for.
      if (frame.type === 'gift') {
        renderGift(frame.user, frame.giftName, frame.count, frame.value, frame.userId)
        return
      }
      // Comments only beyond this. The rest of the wire — likes, joins, view
      // counts, connection status — is not chat, and an overlay that showed it
      // would be a dashboard rather than a chat.
      //
      // These are the backend's own field names, read straight off the socket. The
      // desktop app does not do this: the Rust host remaps every frame to
      // `nickname`/`id` first. So this page is a second consumer of the Python wire
      // format with no host in between, and a rename in backend/events.py reaches
      // it directly — `user` here would become `nickname` and every row would go
      // blank with no error. test/test-overlay-page.mjs pins these names.
      if (frame.type !== 'comment') return
      enqueue(frame.user, frame.text, frame.userId)
    }

    socket.onclose = function () {
      say('socket closed, retrying')
      setTimeout(connect, 3000)
    }

    socket.onerror = function () {
      // `close` always follows `error`, and it is `close` that schedules the
      // retry. Doing it here too would open two connections per failure.
      say('socket error')
    }
  }

  connect()
})()
</script>

<!-- Filled in by the host before the page is served. The id is what the script
     above reads it by; the text is JSON so it is inert until something parses it.
     A `<script type="application/json">` rather than an inline assignment
     because this one is data, not code. -->
<script id="overlay-config" type="application/json">__OVERLAY_CONFIG__</script>
</body>
</html>
