<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Gift Stickers</title>
<!--
  A gallery for the downloaded gift stickers: 792 of them, browsable and
  searchable. One self-contained page so it can be dropped anywhere — it reads
  gifts.json from the same directory and loads each sticker by filename, with no
  build step and no framework. The point is to find a gift and see its sticker,
  so search and a coin filter are the only controls, and the grid loads images
  lazily because 792 of them at once would be 792 requests on open.
-->
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #ffd76a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.4;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(15, 17, 21, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
  }
  .bar {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  h1 {
    font-size: 18px;
    margin: 0 12px 0 0;
    font-weight: 700;
    white-space: nowrap;
  }
  h1 span { color: var(--muted); font-weight: 400; }
  #search {
    flex: 1 1 220px;
    min-width: 180px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
  }
  #count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px 10px;
    text-align: center;
    transition: transform 0.08s ease, border-color 0.08s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card img {
    width: 72px;
    height: 72px;
    object-fit: contain;
    image-rendering: auto;
    /* A faint checker so a transparent sticker is visible against the card. */
    background:
      repeating-conic-gradient(#22262f 0% 25%, #1a1d25 0% 50%) 50% / 16px 16px;
    border-radius: 8px;
  }
  .name {
    font-size: 12px;
    margin-top: 8px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .coin {
    font-size: 11px;
    color: var(--accent);
    margin-top: 2px;
  }
  .gid { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 15px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>TikTok Gifts <span id="total"></span></h1>
    <input id="search" type="search" placeholder="Search name or ID…" autocomplete="off">
    <select id="sort">
      <option value="coin-desc">Coins: high → low</option>
      <option value="coin-asc">Coins: low → high</option>
      <option value="name">Name: A → Z</option>
    </select>
    <span id="count"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No gifts match.</div>
</main>
<footer>792 stickers · local · no network calls</footer>

<script>
(async function () {
  'use strict'
  var grid = document.getElementById('grid')
  var empty = document.getElementById('empty')
  var count = document.getElementById('count')
  var total = document.getElementById('total')
  var search = document.getElementById('search')
  var sortSel = document.getElementById('sort')

  var gifts = []
  try {
    var res = await fetch('gifts.json')
    gifts = await res.json()
  } catch (e) {
    empty.hidden = false
    empty.textContent = 'Could not load gifts.json: ' + e.message
    return
  }
  total.textContent = '· ' + gifts.length

  function coinVal(g) {
    var n = parseInt(String(g.coin).replace(/[^0-9]/g, ''), 10)
    return isNaN(n) ? 0 : n
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  function apply() {
    var q = search.value.trim().toLowerCase()
    var sort = sortSel.value
    var list = gifts.filter(function (g) {
      if (!q) return true
      return g.name.toLowerCase().indexOf(q) !== -1 || String(g.id).indexOf(q) !== -1
    })
    // Name is always the tie-break, so equal coins keep a stable alphabetical
    // order rather than whatever order they arrived in.
    var byName = function (a, b) {
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0
    }
    list.sort(function (a, b) {
      if (sort === 'name') return byName(a, b)
      if (sort === 'coin-asc') return coinVal(a) - coinVal(b) || byName(a, b)
      return coinVal(b) - coinVal(a) || byName(a, b)
    })

    count.textContent = list.length + ' shown'
    empty.hidden = list.length > 0
    // Rebuild the grid. 792 cards is fine to render at once; images are lazy so
    // only what scrolls into view is fetched.
    grid.innerHTML = list.map(function (g) {
      return (
        '<div class="card">' +
          '<img loading="lazy" src="' + esc(g.file) + '" alt="' + esc(g.name) + '">' +
          '<div class="name" title="' + esc(g.name) + '">' + esc(g.name) + '</div>' +
          '<div class="coin">' + (g.coin ? esc(g.coin) + ' coin' : '') + '</div>' +
          '<div class="gid">ID: ' + esc(g.id) + '</div>' +
        '</div>'
      )
    }).join('')
  }

  search.addEventListener('input', apply)
  sortSel.addEventListener('change', apply)
  apply()
})()
</script>
</body>
</html>
