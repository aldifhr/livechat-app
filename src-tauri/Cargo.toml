[package]
name = "livechat-app"
version = "0.1.0"
description = "TikTok live chat viewer"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Reached only from here: the webview's content security policy forbids it from
# talking to any host but the app's own origin, which is the right shape for an
# API key that must not end up in the page.
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
