<script>
(function () {
  'use strict'
  var NS = 'http://www.w3.org/2000/svg'
  var $ = function (id) { return document.getElementById(id) }
  function set(id, o) { var el = $(id); for (var k in o) el.setAttribute(k, o[k]) }

  // ===== Area layar game. Jaga y+h <= 1404 (batas panel Comments). =====
  var HOLE = { x: 80, y: 744, w: 960, h: 540 }
  // =====================================================================
  HOLE.h = Math.min(HOLE.h, 1404 - HOLE.y)
  var h = HOLE
  set('holeRect', { x: h.x, y: h.y, width: h.w, height: h.h })
  set('selBorder', { x: h.x - 3, y: h.y - 3, width: h.w + 6, height: h.h + 6 })
  set('hTL', { cx: h.x - 14, cy: h.y - 14 })
  set('hBR', { cx: h.x + h.w + 14, cy: h.y + h.h + 14 })
  set('colHi', { x: h.x, width: h.w }); set('colHiLine', { x: h.x, width: h.w })
  set('rowHi', { y: h.y, height: h.h }); set('rowHiLine', { y: h.y, height: h.h })

  // ---- grid dibangun lewat kode supaya file ringkas ----
  var F = 'font-family="Calibri, Carlito, Roboto, Arial, DejaVu Sans, sans-serif"'
  var cols = [70, 180, 550, 800, 1070], R = 60, TOP = 324, ROWS = 23
  var s = ''
  for (var r = 1; r < ROWS; r += 2) s += '<rect x="70" y="' + (TOP + R * r) + '" width="1010" height="' + R + '" fill="#d9e1f2"/>'
  for (var i = 0; i <= ROWS + 1; i++) s += '<line x1="70" y1="' + (TOP + R * i) + '" x2="1080" y2="' + (TOP + R * i) + '" stroke="#d9d9d9" stroke-width="2"/>'
  cols.forEach(function (x) { s += '<line x1="' + x + '" y1="264" x2="' + x + '" y2="1704" stroke="#d9d9d9" stroke-width="2"/>' })
  s += '<line x1="1080" y1="264" x2="1080" y2="1704" stroke="#d9d9d9" stroke-width="2"/>'
  s += '<rect x="70" y="324" width="1010" height="60" fill="#4472c4"/>'
  var heads = [['h1', 'No', 82, 128], ['h2', 'Kegiatan', 192, 498], ['h3', 'Jam', 562, 748], ['h4', 'Ket.', 812, 1018]]
  heads.forEach(function (c) {
    s += '<text x="' + c[2] + '" y="366" font-size="36" fill="#fff" font-weight="bold" ' + F + ' data-k="' + c[0] + '">' + c[1] + '</text>'
    s += '<rect x="' + c[3] + '" y="332" width="44" height="44" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2" rx="4"/>'
    s += '<polygon points="' + (c[3] + 11) + ',346 ' + (c[3] + 33) + ',346 ' + (c[3] + 22) + ',357" fill="#444"/>'
  })
  var data = [
    ['Rapat penting', '08.00', 'OK'], ['Cek email', '08.30', 'Mager'], ['Ngopi dulu', '09.00', 'Aman'],
    ['Revisi FINAL2', '09.30', 'Error'], ['Rapat dadakan', '10.00', 'Zzz'], ['Ngelag', '10.30', 'Lag']
  ]
  data.forEach(function (d, i) {
    var y = TOP + R * (i + 1) + 42, n = i + 1
    s += '<g clip-path="url(#cA)"><text x="168" y="' + y + '" font-size="38" text-anchor="end" ' + F + '>' + n + '</text></g>'
    s += '<g clip-path="url(#cB)"><text x="192" y="' + y + '" font-size="38" ' + F + ' data-k="r' + n + '">' + d[0] + '</text></g>'
    s += '<g clip-path="url(#cC)"><text x="562" y="' + y + '" font-size="38" ' + F + ' data-k="t' + n + '">' + d[1] + '</text></g>'
    s += '<g clip-path="url(#cD)"><text id="s' + n + '" x="812" y="' + y + '" font-size="38" ' + F + ' data-k="s' + n + '">' + d[2] + '</text></g>'
  })
  s += '<line x1="70" y1="1284" x2="1080" y2="1284" stroke="#4472c4" stroke-width="4"/>'
  s += '<text x="192" y="1326" font-size="38" font-weight="bold" ' + F + ' data-k="total">TOTAL</text>'
  s += '<text x="562" y="1326" font-size="38" font-weight="bold" ' + F + ' data-k="totalTime">~ jam</text>'
  s += '<text x="812" y="1326" font-size="38" font-weight="bold" ' + F + ' data-k="totalPct">0%</text>'
  s += '<text x="192" y="1386" font-size="38" ' + F + ' data-k="note">Jangan dibuka kalau Bos lewat.</text>'
  s += '<polygon points="1070,564 1040,564 1070,594" fill="#8764b8"/>'
  $('cells').innerHTML = s

  // header kolom (A-D) dan nomor baris; yang masuk area seleksi diberi hijau tua
  var UI = 'font-family="Segoe UI, Roboto, Inter, Arial, DejaVu Sans, sans-serif"'
  var hd = ''
  ;['A', 'B', 'C', 'D'].forEach(function (L, i) {
    var cx = (cols[i] + cols[i + 1]) / 2, on = cx >= h.x && cx <= h.x + h.w
    hd += '<text x="' + cx + '" y="306" font-size="34" text-anchor="middle" fill="' + (on ? '#185c37' : '#444') + '" ' + (on ? 'font-weight="600" ' : '') + UI + '>' + L + '</text>'
    hd += '<line x1="' + cols[i + 1] + '" y1="264" x2="' + cols[i + 1] + '" y2="324" stroke="#c4c4c4" stroke-width="2"/>'
  })
  hd += '<line x1="70" y1="264" x2="70" y2="324" stroke="#c4c4c4" stroke-width="2"/><line x1="0" y1="324" x2="1080" y2="324" stroke="#ababab" stroke-width="2"/>'
  for (var n = 1; n <= ROWS; n++) {
    var top = TOP + R * (n - 1), mid = top + R / 2, on2 = mid >= h.y && mid <= h.y + h.h
    hd += '<text x="35" y="' + (top + 42) + '" font-size="32" text-anchor="middle" fill="' + (on2 ? '#185c37' : '#444') + '" ' + (on2 ? 'font-weight="600" ' : '') + UI + '>' + n + '</text>'
    hd += '<line x1="0" y1="' + (top + R) + '" x2="70" y2="' + (top + R) + '" stroke="#c4c4c4" stroke-width="2"/>'
  }
  hd += '<line x1="70" y1="264" x2="70" y2="1704" stroke="#ababab" stroke-width="2"/>'
  $('hdrs').innerHTML = hd

  // ---- override teks lewat query ----
  var q = new URLSearchParams(location.search), overridden = {}
  document.querySelectorAll('[data-k]').forEach(function (el) {
    var k = el.getAttribute('data-k'), v = q.get(k)
    if (v !== null) { el.textContent = v; overridden[k] = true }
  })

  // ---- kursor formula bar ----
  var f = $('formula'), cur = $('cursor')
  try { cur.setAttribute('x', 246 + f.getComputedTextLength() + 4) } catch (e) { cur.remove() }

  // ---- sel hidup: status berganti sesekali ----
  var flips = [['s4', 'Error', 'OK'], ['s6', 'Lag', 'Aman'], ['s2', 'Mager', 'Gas']]
  var tick = 0
  setInterval(function () {
    var f2 = flips[tick++ % flips.length]
    if (overridden[f2[0]]) return
    var el = $(f2[0])
    el.textContent = el.textContent === f2[1] ? f2[2] : f2[1]
  }, 3500)

  // ---- skala stage ----
  var stage = $('stage')
  function fit() {
    var k = Math.min(innerWidth / 1080, innerHeight / 1920)
    stage.style.width = (1080 * k) + 'px'
    stage.style.height = (1920 * k) + 'px'
    stage.style.setProperty('--s', String(k))
  }
  addEventListener('resize', fit); fit()

  // ---- chat live ----
  var baked = {}
  try { baked = JSON.parse($('overlay-config').textContent) || {} } catch (e) {}
  var room = (q.get('room') || '').trim().replace(/^@/, '')
  var base = String(baked.baseUrl || '').replace(/\/$/, '')
  var feed = $('live-feed'), note = $('live-note'), MAX = 2
  var resolved = null, retry = null

  function say(t) { note.textContent = t }
  function clock() { return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) }
  function initial(n) { return (Array.from(n)[0] || '?').toUpperCase() }

  function addCard(frame) {
    if (note.textContent) say('')
    var name = String(frame.user || '?')
    var card = document.createElement('div'); card.className = 'live-card'
    var head = document.createElement('div'); head.className = 'live-head'
    var av = document.createElement('div'); av.className = 'live-avatar'
    if (frame.avatar) {
      var img = document.createElement('img')
      img.referrerPolicy = 'no-referrer'; img.alt = ''
      img.onerror = function () { img.remove(); av.textContent = initial(name) }
      img.src = frame.avatar
      av.appendChild(img)
    } else av.textContent = initial(name)
    var label = document.createElement('span'); label.className = 'live-name'; label.textContent = name
    var when = document.createElement('span'); when.className = 'live-time'; when.textContent = clock()
    head.appendChild(av); head.appendChild(label); head.appendChild(when)
    var text = document.createElement('div'); text.className = 'live-text'; text.textContent = String(frame.text || '')
    card.appendChild(head); card.appendChild(text)
    feed.appendChild(card)
    while (feed.children.length > MAX) feed.removeChild(feed.firstChild)
  }

  // antrean: tiap komentar tampil minimal 1,8 detik
  var queue = [], busy = false
  function push(fr) { queue.push(fr); if (queue.length > 20) queue.shift(); drain() }
  function drain() {
    if (busy || !queue.length) return
    busy = true; addCard(queue.shift())
    setTimeout(function () { busy = false; drain() }, 1800)
  }

  function later(ms) { clearTimeout(retry); retry = setTimeout(connect, ms) }
  function looksLikeRoomId(v) { return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v) }

  function openSocket(id) {
    var ws
    try { ws = new WebSocket(base.replace(/^http/, 'ws') + '/ws/overlay/' + encodeURIComponent(id)) }
    catch (e) { say('URL backend tidak valid: ' + e.message); later(5000); return }
    ws.onopen = function () { say('') }
    ws.onmessage = function (ev) {
      var fr; try { fr = JSON.parse(ev.data) } catch (e) { return }
      if (fr && fr.type === 'comment') push(fr)
    }
    ws.onclose = function () { say('koneksi putus, menyambung ulang…'); later(3000) }
    ws.onerror = function () {}
  }

  function connect() {
    if (!room) { say('tambahkan ?room=<username atau id> di link'); return }
    if (!base) { say('baseUrl kosong: __OVERLAY_CONFIG__ belum diganti'); return }
    if (!resolved && looksLikeRoomId(room)) resolved = room
    if (resolved) { openSocket(resolved); return }
    fetch(base + '/api/room-connect-by-username', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: room })
    })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
      .then(function (d) { if (!d || !d.room_id) throw new Error('room id tidak ada di jawaban'); resolved = d.room_id; openSocket(resolved) })
      .catch(function (e) { say('gagal resolve ' + room + ': ' + e.message); later(5000) })
  }
  connect()
})()
</script>
</body>
</html>
