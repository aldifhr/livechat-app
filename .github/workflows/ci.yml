# Every suite in the repo, on every push.
#
# There was no CI at all, which made "everything is green" a claim about whoever
# last remembered to run it. Four parts build from four directories with four
# different toolchains and no root manifest between them, so they are four jobs:
# one failure should not hide the other three, and each is a few minutes rather
# than one queue behind a Tauri build.
#
# What is NOT here, and why:
#   - `scripts/deploy-web.sh` and `api/tests` touching a real store. The
#     backend suites point `STREAMKIT_CONFIG_DIR` at a temp dir each, so they
#     cannot reach `api/config/rooms.json`.
#   - Any secret. Nothing in any suite reads one; the token gates are exercised
#     by setting `STREAMKIT_TOKEN` in the test's own env.
#   - A build of the installer. `tauri build` needs a signing identity and a
#     bundler per platform, and a green test run says nothing about whether that
#     worked. Releases stay a deliberate, human action.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes, so a branch with
# five commits does not queue five full Rust builds behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop app (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # `npm test` is typecheck plus every suite, so a type error fails here
      # before any of them run rather than after.
      - run: npm test

  rust:
    name: desktop app (rust)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Tauri's build script links against these through pkg-config, so the
      # crate will not compile without them even though no test touches a window.
      # `libwebkit2gtk-4.1` is the Tauri v2 split from the 4.0 that Ubuntu 20.04
      # shipped; on 22.04 the name and the version are both right.
      - name: system libraries tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: cargo test
      # Warnings are not failures here, but an unused import is almost always a
      # half-finished edit, and the changelog records several being cleaned up by
      # hand. Printed, not denied, so a new warning is visible without blocking.
      - run: cargo build 2>&1 | grep -E "^warning" || true

  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    name: backend (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned, not `latest`: the backend targets 3.12, and a runner that
          # quietly moves to 3.14 turns a passing suite into a failing one for
          # reasons that have nothing to do with the change under test.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      # The runner, not pytest: there is no pytest here. It starts each suite in
      # its own subprocess with its own `STREAMKIT_CONFIG_DIR`, and checks the
      # count against the files on disk so a stray test cannot silently not run.
      - run: python tests/run_all.py
