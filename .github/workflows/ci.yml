# Every suite in the repo, on every push.
#
# There was no CI at all, which made "everything is green" a claim about whoever
# last remembered to run it. Three parts build from three directories with three
# different toolchains and no root manifest between them, so they are three jobs:
# one failure should not hide the other two, and each is a few minutes rather
# than one queue behind a Tauri build.
#
# What is NOT here, and why:
#   - `scripts/deploy-web.sh` touching a real deployment. The suites never
#     reach a live Convex deployment or a TikTok socket.
#   - Any secret. Nothing in any suite reads one; the Convex token gate is
#     exercised by setting `STREAMKIT_TOKEN` in the test's own env.
#   - A Convex deploy. Functions are typechecked here; pushing them is a
#     deliberate deploy action on the VPS, not a CI step.
#
# The FastAPI backend (`api/`) was removed in the Convex migration; the
# Node TikTok bridge (`backend/`) replaced its test job. `shared/` stayed,
# because the dashboard imports it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes, so a branch with
# five commits does not queue five full builds behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Convex functions have their own tsconfig (the app's excludes them).
      # Typechecked here so a broken mutation fails CI, not the deploy.
      - run: npx tsc --noEmit -p convex/tsconfig.json

  bridge:
    name: tiktok bridge (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
