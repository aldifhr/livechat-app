  function set(id,o){var el=$(id);for(var k in o)el.setAttribute(k,o[k])}
  (function(){
    var h=HOLE;
    set('holeRect',{x:h.x,y:h.y,width:h.w,height:h.h});
    set('selBorder',{x:h.x-3,y:h.y-3,width:h.w+6,height:h.h+6});
    set('hTL',{cx:h.x-14,cy:h.y-14});
    set('hBR',{cx:h.x+h.w+14,cy:h.y+h.h+14});
    set('colHi',{x:h.x,width:h.w}); set('colHiLine',{x:h.x,width:h.w});
    set('rowHi',{y:h.y,height:h.h}); set('rowHiLine',{y:h.y,height:h.h});
  })();

<script>
(function () {
  'use strict'
  function fit() {
    var k = Math.min(innerWidth / 1080, innerHeight / 1920)
    document.getElementById('stage').style.transform = 'scale(' + k + ')'
  }
  addEventListener('resize', fit)
  fit()

  var baked = (function () {
    try { return JSON.parse(document.getElementById('overlay-config').textContent) || {} }
    catch (e) { return {} }
  })()
  var query = new URLSearchParams(location.search)
  var room = query.get('room') || ''
  var base = String(baked.baseUrl || '').replace(/\/$/, '')
  var feed = document.getElementById('live-feed')
  var note = document.getElementById('live-note')
  var MAX = 2

  function say(text) { note.textContent = text }
  function clock() { return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) }

  function addCard(frame) {
    if (note.textContent) say('')
    var card = document.createElement('div')
    card.className = 'live-card'
    var head = document.createElement('div')
    head.className = 'live-head'
    var avatar = document.createElement('div')
    avatar.className = 'live-avatar'
    var name = String(frame.user || '?')
    if (frame.avatar) {
      var img = document.createElement('img')
      img.src = frame.avatar
      img.alt = ''
      img.onerror = function () { img.remove(); avatar.textContent = name.charAt(0).toUpperCase() }
      avatar.appendChild(img)
    } else avatar.textContent = name.charAt(0).toUpperCase()
    var label = document.createElement('span')
    label.className = 'live-name'
    label.textContent = name
    var when = document.createElement('span')
    when.className = 'live-time'
    when.textContent = clock()
    head.appendChild(avatar); head.appendChild(label); head.appendChild(when)
    var text = document.createElement('div')
    text.className = 'live-text'
    text.textContent = String(frame.text || '')
    card.appendChild(head); card.appendChild(text)
    feed.appendChild(card)
    while (feed.children.length > MAX) feed.removeChild(feed.firstChild)
  }

  function looksLikeRoomId(v) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)
  }

  function open(roomId) {
    var socket
    try { socket = new WebSocket(base.replace(/^http/, 'ws') + '/ws/overlay/' + encodeURIComponent(roomId)) }
    catch (error) { say('bad backend URL: ' + error.message); setTimeout(connect, 5000); return }
    socket.onopen = function () { say('') }
    socket.onmessage = function (event) {
      var frame
      try { frame = JSON.parse(event.data) } catch (e) { return }
      if (frame && frame.type === 'comment') addCard(frame)
    }
    socket.onclose = function () { say('socket closed, reconnecting…'); setTimeout(connect, 3000) }
    socket.onerror = function () {}
  }

  function connect() {
    if (!room || !base) { say('add ?room=<handle or id> to the link'); return }
    if (looksLikeRoomId(room)) { open(room); return }
    fetch(base + '/api/room-connect-by-username', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: room })
    })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
      .then(function (d) { if (!d || !d.room_id) throw new Error('no room id in the answer'); open(d.room_id) })
      .catch(function (e) { say('cannot resolve ' + room + ': ' + e.message); setTimeout(connect, 5000) })
  }
  connect()
})()
</script>
