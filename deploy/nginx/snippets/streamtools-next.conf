# How nginx reaches the Next server. Included by every location that proxies to
# it, so the upstream and the forwarded headers are written once and cannot drift
# between the gated and the open locations.
proxy_pass http://127.0.0.1:5184;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
