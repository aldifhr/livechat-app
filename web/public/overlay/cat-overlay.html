<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kucing Pixel Stream</title>
<style>
:root{--bg:#f4efe9;--panel:#fffaf3;--ink:#2b1f2d;--line:#d9cbbb;--acc:#f08a3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a24;--panel:#2a2633;--ink:#f3ece4;--line:#443d52}}
:root[data-theme="dark"]{--bg:#1d1a24;--panel:#2a2633;--ink:#f3ece4;--line:#443d52}
html,body{height:100%;margin:0}

canvas{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;touch-action:manipulation}
#ui{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border:3px solid var(--ink);border-radius:0;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;box-shadow:4px 4px 0 var(--ink)}

</style></head><body>
<canvas id="c"></canvas><div id="bub"></div><div id="ui"></div>
<script id="overlay-config" type="application/json">__OVERLAY_CONFIG__</script>
<script>
// ---- config from URL ----
const q=new URLSearchParams(location.search)
const clean=q.has('clean')
const root=document.documentElement
root.classList.add('clean')
// The page and its socket are served by different hosts in production: nginx serves
// the page from the dashboard host, and the websocket lives on the backend. Reading the
// socket origin off `location.origin` therefore dialled a host with no `/ws/` on it and
// the overlay sat there silently reconnecting to itself. The host bakes the real one in
// here, `?base=` still overrides it, and this page's own origin is the fallback for
// when the page is opened straight off the backend.
// The placeholder is left literal when the backend has no stored config for the room,
// hence the try/catch rather than a direct parse.
const baked=(()=>{try{return JSON.parse(document.getElementById('overlay-config').textContent)||{}}catch(e){return{}}})()
const BASE=(q.get('base')||baked.baseUrl||location.origin).replace(/\/+$/,'')
// One knob for every timer in the file, applied to `dt` so it is visual time and not
// just a faster loop. An overlay can sit on a canvas for six hours; someone who finds
// the cat restless needs to be able to turn it down without editing the file.
// Written with Math rather than the `cl` helper below, which is not initialised yet.
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches
const rateFromUrl=parseFloat(q.get('speed'))
let rate=q.has('speed')&&rateFromUrl>0?Math.min(2,Math.max(.25,rateFromUrl)):(REDUCED?.6:1)

// ---- chat overlay (WebSocket) ----
const roomId=q.get('room')||''
let chatSocket=null
let lastEvent=Date.now()
const IDLE_SLEEP_MS=180000 // 3 minutes without events → cat gets sleepy

/** Wake the cat if sleeping, then react. */
function wake(){
  if(C.mode==='sleep')setMode('walk')
  lastEvent=Date.now()
}

/** Where the cat's shoulders are, for spawning particles off its body. */
function backY(){return GY-(m_height(C.mode))}

/** Height of the standing cat, so particle spawn points follow the pose instead of
 *  guessing one number that is only right when the cat is upright. */
function m_height(m){return m==='sleep'||m==='loaf'?30:m==='roll'?22:48}

/** React to a gift / like / follow: hearts + animation, no bubble text. */
function react(frame){
  wake()
  const kind=frame.type
  boop()
  C.boop=1.2
  for(let i=0;i<6;i++)em('heart',C.x+rnd(-12,12),backY()+rnd(-6,6),rnd(-10,10),rnd(-36,-20),1.4)
  if(kind==='gift'){setMode('zoom')}
  else if(kind==='like'){setMode('jump')}
  else{setMode('vibe')}
}

function connectChat(){
  if(!roomId)return
  const base=BASE.replace(/^http/,'ws')
  const url=base+'/ws/overlay/'+encodeURIComponent(roomId)
  chatSocket=new WebSocket(url)
  chatSocket.onopen=()=>console.log('[cat] chat connected')
  chatSocket.onmessage=(event)=>{
    try{
      const frame=JSON.parse(event.data)
      if(frame.type==='comment'&&frame.text){
        // Comments do not show a bubble — they just make the cat react (hearts).
        wake()
        C.boop=1.2
        for(let i=0;i<6;i++)em('heart',C.x+rnd(-10,10),backY()-4,rnd(-8,8),rnd(-30,-18),1.2)
      } else if(frame.type==='gift'||frame.type==='like'||frame.type==='follow'){
        react(frame)
      }
    }catch(e){}
  }
  chatSocket.onclose=()=>{setTimeout(connectChat,3000)}
  chatSocket.onerror=()=>{try{chatSocket.close()}catch(e){}}
}
if(roomId)connectChat()

// ---- kucing pixel (dari file asli) ----
const cv=document.getElementById('c'),g=cv.getContext('2d'),ui=document.getElementById('ui'),bub=document.getElementById('bub')
const bc=document.createElement('canvas');bc.width=96;bc.height=96;const b=bc.getContext('2d',{willReadFrequently:true})
const sc=document.createElement('canvas');sc.width=96;sc.height=96;const sx=sc.getContext('2d')
let X=b,W,H,w,h,PS,GY,mx=-1e4,my=0,TT=0,pal='hitam',chonk=false,auto=true,bgm=q.get('bg')==='hijau'?'hijau':'kotak'
const OL='#2b1f2d',lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v))
// Each palette is a ramp, dark to light: `s` stripe, `lo` shadow, `d` far-side mid,
// `b` body, `hi` highlight, then the two light materials.
//
// The ramp is the whole point. These used to be five flat colours and the highlight was
// `mixc`, which lerped 40% toward white — so every palette shaded by *desaturating*:
// orange lost 28 points of saturation on its highlight, the black cat lost 15, and the
// hue never moved anywhere. That is how flat vector art shades. Pixel art on a
// restricted palette shades by moving hue: shadows go cool toward blue and violet,
// highlights go warm toward yellow. The hue column below is monotonic in every palette,
// and saturation rises into the highlight instead of collapsing, which is what makes
// the same three tones read as a machine with a fixed palette rather than a gradient.
const PAL={
  oren :{s:'#7a3410',lo:'#a34d15',d:'#c4631f',b:'#e8813a',hi:'#ffc169',belly:'#fadfae',ear:'#f4737f'},
  abu  :{s:'#333d4d',lo:'#4a5468',d:'#66718a',b:'#8490a8',hi:'#c9d6e8',belly:'#e9eef6',ear:'#f2909f'},
  hitam:{s:'#191622',lo:'#262438',d:'#393352',b:'#544a75',hi:'#a394d4',belly:'#a49bbf',ear:'#e46a8c'},
  putih:{s:'#d99a5c',lo:'#d8c3a4',d:'#e8d9c0',b:'#f6eddc',hi:'#ffffe0',belly:'#ffffff',ear:'#f7a3ae'},
}
// 4x4 ordered dither, indexed y*4+x. Not the pattern that matters — the banding it
// breaks up. Three flat bands with hard edges read as vector shapes; the same three
// bands with an ordered threshold scattering pixels across each boundary read as a
// limited-palette machine, which is the whole look.
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5]
const R=(x,y,a,c2,col)=>{if(a<=0||c2<=0)return;X.fillStyle=col;X.fillRect(Math.round(x),Math.round(y),Math.round(a),Math.round(c2))}
// `sh` is a palette: with one, the ellipse is lit from the upper left and banded into
// that palette's own highlight / body / shadow. Without one it stays a flat fill, which
// is what the small shapes — muzzle, cheek, bubble — still want.
function E(cx,cy,rx,ry,col,o,sh){
  cx=Math.round(cx);cy=Math.round(cy)
  if(o)E(cx,cy,rx+1,ry+1,OL)
  for(let y=-ry;y<=ry;y++){
    const t=y/Math.max(ry,.5),hw=Math.round(rx*Math.sqrt(Math.max(0,1-t*t)))
    if(!sh){R(cx-hw,cy+y,hw*2+1,1,col);continue}
    for(let x=-hw;x<=hw;x++){
      const d=cl((x/Math.max(rx,.5)+y/Math.max(ry,.5))*.5+.5,0,1)
      const n=(BAYER[(((cy+y)&3)<<2)|((cx+x)&3)]+.5)/16
      R(cx+x,cy+y,1,1,d+n<.34?sh.hi:d+n<.70?sh.b:sh.lo)
    }
  }
}
function L(x1,y1,x2,y2,t,col,o){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),1);for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;R(x-t/2-o,y-t/2-o,t+2*o,t+2*o,col)}}
function tri(cx,by,hh,ww,sl,col,o){for(let i=-o;i<=hh+o;i++){const a=Math.max(0,Math.round(ww*(1-i/(hh+1))))+2*o;R(cx+sl*i/hh-a/2,by-i,a,1,col)}}
function spr(a,x,y,col){X=g;a.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='1')R(x+i,y+j,1,1,col)})}
const SP={heart:[['.11.11.','1111111','1111111','.11111.','..111..','...1...'],'#ff4d6d'],z:[['1111','..1.','.1..','1111'],'#8fb8ff'],note:[['..111','..1.1','..1..','.11..','111..'],'#7b6cff'],star:[['..1..','..1..','11111','.111.','11.11'],'#ffd84a']}
function rs(){W=innerWidth;H=innerHeight;const off=clean||root.classList.contains('hide')?30:(W<600?190:120);PS=cl(Math.round(Math.min(W/190,(H-off)/80)),3,10);w=Math.ceil(W/PS);h=Math.ceil(H/PS);cv.width=w;cv.height=h;cv.style.width=w*PS+'px';cv.style.height=h*PS+'px';g.imageSmoothingEnabled=false;GY=h-Math.ceil(off/PS)-2;bub.style.fontSize=Math.max(14,Math.round(PS*3.2))+'px'}
function setBg(){const s=document.body.style;if(clean&&bgm!=='hijau'){s.background='transparent';return}
s.background={kotak:'conic-gradient(#0000 25%,#88822 0 50%,#0000 0 75%,#88822 0) 0 0/28px 28px,var(--bg)',hijau:'#00b140',gelap:'#15121b',terang:'#fff'}[bgm]}
const M={
idle:{d:[1,2],T:{}},
walk:{d:[3,6],T:{amp:.7},v:17,say:['mlaku2 santuy','nyari receh','permisi paket','jalan2 sore','hop hop hop']},
zoom:{d:[1.6,2.4],T:{amp:1.3},v:80,say:['ZOOOM!!','NGEEENG','JAM 3 PAGI','GASKEUN']},
sit:{d:[3,5],T:{sit:1},say:['...','meong','ngapain liat2','hah hah','sabi lah']},
sleep:{d:[5,8],T:{loaf:1},say:['zzz...','5 menit lagi','mimpi ikan','mager']},
vibe:{d:[4,6],T:{sit:1,gl:1},say:['vibing 😎','deal with it','sksksk','ga ada akhlak']},
stare:{d:[3,4],T:{sit:1},say:['bruh.','liat apa lu','anda siapa?','...ok.']},
roll:{d:[2,3],T:{ball:1},v:42,say:['gelindiiing~','wheeee','guling2','menggelinding']},
flop:{d:[3.5,4.5],T:{amp:.5,fl:1},say:['elus dong 🥺','mager parah','rebahan is life']},
// `once` modes keep running with auto off, so a button press still shows the animation.
// A jump is crouch + launch + flight + settle: the crouch alone is CRUNCH_T, and the
// flight is 2*JUMP_V/GRAV. At 1.2s the old duration cut the flight in half, so the cat
// landed and then stood in a jump pose for the rest of the mode.
jump:{d:[1.7,1.7],T:{},v:22,once:1,say:['hup!','NYAWIT!','ampun bang']},
dizzy:{d:[2.2,2.2],T:{sit:1},once:1,say:['pusing...','dunia muter','mual dikit']},
yawn:{d:[1.8,1.8],T:{sit:1},once:1,say:['hoaaam']},
wash:{d:[3,4],T:{sit:1,wash:1},say:['jilat2','mandi kucing','bersih2']},
knead:{d:[3,5],T:{knead:1},say:['biscuit time 🍞','uwu','ulen2 ulen2']}}
const WT=[['walk',5],['sit',2],['sleep',1.5],['roll',2],['zoom',1.5],['flop',1.5],['vibe',1.5],['stare',1.5],['jump',1.5],['yawn',1],['wash',1.5],['knead',1.2],['idle',1]]
// A jump apex of JUMP_V²/(2*GRAV) ≈ 50px, against a ~48px standing body: high enough
// to read as a jump, low enough to stay inside the frame at PS=10.
const GRAV=320,JUMP_V=180,CRUNCH_T=.3,APEX=JUMP_V*JUMP_V/(2*GRAV)
// Every pose channel, and the rate each one blends at. `ext` and `trail` exist because
// a jump cannot be authored as static weights — see the jump timeline in upd().
const CH={amp:7,sit:7,loaf:7,ball:7,tuck:16,gl:4,fl:7,wash:9,knead:7,ext:18,trail:14}
const C={x:100,dir:1,mode:'idle',t:0,tm:2,vx:0,roll:0,jy:0,jv:0,ph:0,stridePx:8,boop:0,land:0,land0:0,landT:0,crunch:0,jph:0,turn:0,wall:1,lean:0,ef:0,earT:2,es:1,blink:3,bt:0,pt:0,P:{amp:0,sit:0,loaf:0,ball:0,tuck:0,gl:0,fl:0,wash:0,knead:0,ext:0,trail:0}},B={t:0},pts=[]
function say(t){/* speech bubble removed */}
function setMode(n){const m=M[n];C.mode=n;C.t=0;C.tm=(!auto&&!m.once)?1e9:rnd(m.d[0],m.d[1])
if(m.v)C.dir=C.x<w*.2?1:C.x>w*.8?-1:(Math.random()<.5?1:-1)
if(n==='jump'){C.jph=0;C.crunch=0}else{C.crunch=0}
if(m.say&&Math.random()<.9)say(pick(m.say))}
function nextMode(){const m=C.mode;if(m==='roll')return setMode('dizzy');if(m==='zoom')return setMode('sit');if(!auto)return setMode('idle')
let r=Math.random()*WT.reduce((a,b)=>a+b[1],0);for(const[k,v]of WT){r-=v;if(r<=0&&k!==m)return setMode(k)}setMode('walk')}
// Per-particle physics. Without it a heart keeps its initial velocity for its whole
// life: a burst of eight travelled in eight dead-straight parallel lines, and dust
// floated upward instead of settling. Negative gravity is the float-up hearts want;
// drag is what turns that into a rise that slows to a stop.
const PG={heart:-9,note:-6,star:-3,z:-4,puff:120},PD={heart:1.9,note:1.5,star:1.2,z:1.2,puff:3},PF={heart:8,note:6,star:4,z:2,puff:0}
function em(t,x,y,vx,vy,l,sz){pts.push({t,x,y,vx,vy,l,L:l,sz,g:PG[t]||0,dr:PD[t]||0,fl:PF[t]||0,ph:rnd(0,6.28)})}
function boop(){C.boop=1.2;for(let i=0;i<6;i++)em('heart',C.x+rnd(-10,10),backY()-4,rnd(-8,8),rnd(-30,-18),1.2);say(pick(['meong!','mrrp~','aduh geli','>w<','ih apaan sih']));if(C.mode==='sleep')setMode('sit');if(C.jy<=0&&C.mode!=='roll'){C.jv=115;C.crunch=Math.max(C.crunch,.45)}}
function upd(dt){const c=C,m=M[c.mode],P=c.P;c.t+=dt;TT+=dt
// Idle → sleepy: after IDLE_SLEEP_MS with no events, put the cat to sleep.
if(auto&&c.mode!=='sleep'&&Date.now()-lastEvent>IDLE_SLEEP_MS){setMode('sleep')}
const T=Object.assign({amp:0,sit:0,loaf:0,ball:0,tuck:0,gl:0,fl:0,wash:0,knead:0,ext:0,trail:0},m.T)
const jumping=c.mode==='jump'
if(jumping){
  // The jump is the one mode with its own timeline. As static weights it was one pose
  // held for the whole flight, and with amp at 0 the stride term in foot() is zero —
  // so the legs stayed welded to the hips from takeoff to landing and the cat read as
  // sliding up and down.
  if(c.jph===0){
    // Load: compress, gather the legs under the body.
    c.crunch=Math.min(1,c.t/CRUNCH_T)
    if(c.t>=CRUNCH_T){c.jph=1;c.jv=JUMP_V}
    T.tuck=c.crunch;T.ext=c.crunch*.25
  }else{
    // Flight, driven off the vertical velocity rather than off the clock: the hind
    // pair trails back on the way up, the front pair reaches out on the way down, and
    // they cross over exactly as the velocity does. `jph` only records which side of
    // the apex this is, so the landing test has something to read.
    c.crunch=Math.max(0,c.crunch-dt*5)
    const up=cl(c.jv/JUMP_V,-1,1)
    T.trail=cl(up*.85,0,1);T.ext=cl(.55-up*.7,-.2,1);T.tuck=cl(up*.45+.1,0,1)
    if(c.jph===1&&c.jv<=0)c.jph=2
  }
}
for(const k in T){const w=P[k],t=T[k];if(w!==t)P[k]=w+(t-w)*Math.min(1,dt*(CH[k]||7))}
const v=jumping&&c.jph===0?0:(m.v||0)
// A wall is a pivot, not a stop. The old code clamped x and zeroed vx on the frame of
// contact, so at zoom speed the cat teleported to a dead halt and reversed; the skid
// keeps momentum bleeding off for a fifth of a second with dust under the feet.
const turning=c.turn>0
c.vx+=(v*c.dir-c.vx)*Math.min(1,dt*(turning?2.2:6))
if(turning){c.turn-=dt;if(Math.random()<dt*45)em('puff',c.x+rnd(-6,6),GY-rnd(1,5),rnd(-26,26),rnd(-26,-4),rnd(.22,.4),rnd(2,4))}
c.x+=c.vx*dt
const lim=w-30
if(c.x<30||c.x>lim){
  const side=c.x<30?1:-1
  c.x=cl(c.x,30,lim)
  if(c.dir!==side&&c.turn<=0){c.turn=.26;c.wall=side;for(let i=0;i<5;i++)em('puff',c.x+rnd(-8,8),GY-rnd(1,4),-side*rnd(14,50),rnd(-26,-4),rnd(.24,.45),rnd(2,4))}
  c.dir=side
}
c.lean+=(cl(c.vx/90,-1,1)*.42-c.lean)*Math.min(1,dt*7)
// Foot phase advances with distance covered, not with time. On a clock, a stride only
// matches the ground at the one speed it was drawn for, so it slides everywhere else —
// 16% overstride at a walk, far worse at zoomies. The frequency saturates instead:
// past a run a cat shortens the cycle rather than lengthening it without limit.
const spd=Math.abs(c.vx)
if(spd>.6){const freq=cl(1+spd/40,1,2.6);c.stridePx=cl(spd/(2*freq),3,26);c.ph+=Math.PI*spd/c.stridePx*dt}
else c.ph+=dt*(c.mode==='flop'?9:c.mode==='knead'?7:c.mode==='roll'?7:1.5)
if(c.mode==='roll')c.roll+=Math.abs(c.vx)/11*dt;else{const tg=c.mode==='flop'?Math.PI+2*Math.PI*Math.round((c.roll-Math.PI)/(2*Math.PI)):2*Math.PI*Math.round(c.roll/(2*Math.PI));c.roll+=(tg-c.roll)*Math.min(1,dt*6)}
if(c.jy>0||c.jv>0){c.jv-=GRAV*dt;c.jy+=c.jv*dt;if(c.jy<=0){
  // Falling speed sets the absorb, so a boop-hop does not flatten the cat.
  const hard=cl(-c.jv/150,0,1)
  c.jy=0;c.jv=0;c.jph=2
  c.land0=.42*hard+.05;c.landT=.42
  for(let i=0;i<2+hard*6|0;i++)em('puff',c.x+rnd(-12,12),GY-rnd(1,3),rnd(-26,26)*(1+hard),rnd(-14,-2),rnd(.28,.5),rnd(2,4))
}}
// Ease-out, not linear: squash that decays at a constant rate reads as a mechanism
// resetting rather than a body springing back.
c.land=c.landT>0?c.land0*Math.pow(c.landT/.42,2):0
if(c.landT>0)c.landT=Math.max(0,c.landT-dt)
c.crunch=Math.max(0,c.crunch-dt*2.2)
c.boop=Math.max(0,c.boop-dt);B.t-=dt
c.earT-=dt;if(c.earT<0){c.ef=.25;c.es=Math.random()<.5?-1:1;c.earT=rnd(1.5,4)}c.ef=Math.max(0,c.ef-dt)
c.blink-=dt;if(c.blink<0){c.bt=.15;c.blink=rnd(2,5)}c.bt=Math.max(0,c.bt-dt)
c.pt-=dt;if(c.pt<=0){const hx=c.x+c.dir*4,hy=backY(),n=c.mode
if(n==='sleep'){em('z',hx+8,hy,3,-9,2);c.pt=1}
else if(n==='vibe'){em('note',hx,hy-4,rnd(-8,8),-12,1.4);c.pt=.45}
else if(n==='zoom'){em('puff',c.x-c.dir*14,GY-3,-c.dir*15,-2,.5,4);c.pt=.05}
else if(n==='roll'){em('puff',c.x,GY-2,-c.dir*8,-3,.5,3);c.pt=.12}
else if(n==='walk'){em('puff',c.x-c.dir*10,GY-1,-c.dir*4,-2,.45,2);c.pt=.3}
else if(n==='dizzy'){em('star',hx+rnd(-8,8),hy-6,rnd(-6,6),-5,1);c.pt=.25}
else if(n==='knead'||n==='wash'){em('heart',hx+rnd(-8,8),hy-4,rnd(-4,4),-12,1.2);c.pt=.7}
else c.pt=.2}
for(let i=pts.length-1;i>=0;i--){const p=pts[i]
  p.vy+=p.g*dt
  if(p.dr){p.vx-=p.vx*p.dr*dt;p.vy-=p.vy*p.dr*dt}
  p.x+=(p.vx+Math.sin(TT*p.fl+p.ph)*p.fl*.55)*dt
  p.y+=p.vy*dt
  p.l-=dt
  if(p.l<=0||p.y>GY+6)pts.splice(i,1)}
if(c.t>=c.tm)nextMode()}
// Amplitude is half the stride, so a foot covers exactly the ground the body does in
// half a cycle. The old fixed (5+amp*3)*amp swung further than the ground at every
// speed — that mismatch is the slide. Lift rides on the forward swing only, on a
