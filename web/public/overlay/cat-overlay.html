<canvas id="c"></canvas><div id="ui"></div>
<script id="overlay-config" type="application/json">__OVERLAY_CONFIG__</script>
<script>
// ---- config from URL ----
const q=new URLSearchParams(location.search)
const clean=q.has('clean')
const root=document.documentElement
// The `clean` class is what OBS gets: it hides the toolbar and makes the background
// transparent. It was being added on every load, which meant the toolbar was unreachable
// even on a plain link — the one place it exists to be used from. Added only when asked
// for, and every link the dashboard generates carries `?clean=1`.
if(clean)root.classList.add('clean')
// The page and its socket are served by different hosts in production: nginx serves
// the page from the dashboard host, and the websocket lives on the backend. Reading the
// socket origin off `location.origin` therefore dialled a host with no `/ws/` on it and
// the overlay sat there silently reconnecting to itself. The host bakes the real one in
// here, `?base=` still overrides it, and this page's own origin is the fallback for
// when the page is opened straight off the backend.
// The placeholder is left literal when the backend has no stored config for the room,
// hence the try/catch rather than a direct parse.
const baked=(()=>{try{return JSON.parse(document.getElementById('overlay-config').textContent)||{}}catch(e){return{}}})()
const BASE=(q.get('base')||baked.baseUrl||location.origin).replace(/\/+$/,'')
// One knob for every timer in the file, applied to `dt` so it is visual time and not
// just a faster loop. An overlay can sit on a canvas for six hours; someone who finds
// the cat restless needs to be able to turn it down without editing the file.
// Written with Math rather than the `cl` helper below, which is not initialised yet.
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches
const rateFromUrl=parseFloat(q.get('speed'))
let rate=q.has('speed')&&rateFromUrl>0?Math.min(2,Math.max(.25,rateFromUrl)):(REDUCED?.6:1)

// ---- chat overlay (WebSocket) ----
const roomId=q.get('room')||''
let chatSocket=null
let lastEvent=Date.now()
let offline=false
const IDLE_SLEEP_MS=180000 // 3 minutes without events → cat gets sleepy

/** Wake the cat if sleeping, then react. */
function wake(){
  // Offline is the streamer's state, not the cat's mood: a stray frame or a boop
  // must not wake a cat that is asleep because nothing is being streamed.
  if(offline)return
  if(C.mode==='sleep')setMode('walk')
  lastEvent=Date.now()
}

/** Where the cat's shoulders are, for spawning particles off its body. */
function backY(){return GY-(m_height(C.mode))}

/** Height of the standing cat, so particle spawn points follow the pose instead of
 *  guessing one number that is only right when the cat is upright. */
function m_height(m){return m==='sleep'||m==='loaf'?30:48}

/**
 * Whether a `status` frame means the streamer is not live.
 *
 * `connecting` on its own is a handshake in flight, which lasts a second and must
 * not put the cat to sleep. `waiting` and `liveEnded` are the opposite: the backend
 * is polling for a streamer who is not broadcasting, and that can last hours.
 * `connected: false` without either is the plain offline case.
 */
function isOfflineStatus(frame){
  return frame.connected!==true&&(frame.waiting===true||frame.liveEnded===true||frame.connecting!==true)
}

/** Put the cat to sleep for as long as the streamer is offline, or wake it. */
function applyStatus(frame){
  const now=isOfflineStatus(frame)
  if(now){
    offline=true
    // Past any mode's duration, so the auto-mode timer cannot stand it back up.
    if(C.mode!=='sleep')setMode('sleep')
    C.tm=1e9
  } else if(offline){
    offline=false
    lastEvent=Date.now()
    if(C.mode==='sleep')setMode('walk')
  }
}

/**
 * The gift tiers, by diamond value.
 *
 * A Rose and a thousand-diamond combo used to produce the same single hop, so the
 * overlay said "somebody sent something" and nothing about how much. The tiers are
 * the only signal the page has that the gift was large: the wire carries `value`,
 * not a rank.
 */
const GIFT_TIERS=[
  {min:1000,hearts:16,stars:10,boost:1.45},
  {min:100,hearts:10,stars:4,boost:1.25},
  {min:0,hearts:6,stars:0,boost:1},
]
function giftTier(value){for(const t of GIFT_TIERS)if(value>=t.min)return t;return GIFT_TIERS[GIFT_TIERS.length-1]}

/** A burst of one particle type off the cat's back. */
function burst(type,n,spread,life){
  for(let i=0;i<n;i++)em(type,C.x+rnd(-spread,spread),backY()+rnd(-6,6),rnd(-12,12),rnd(-38,-20),life)
}

/**
 * React to a gift / like / follow: hearts + animation, no bubble text.
 *
 * The three are deliberately different now. They used to share one path, which
 * meant a single like — the cheapest, most frequent thing a viewer can do — threw
 * the same jump as a gift, and a fast room left the cat permanently airborne.
 */
function react(frame){
  if(offline)return
  wake()
  const kind=frame.type
  if(kind==='like'){
    // Cheap and frequent: a small heart puff, and no jump. `wake()` is the whole
    // reaction, so a stream of likes keeps the cat awake without interrupting it.
    burst('heart',3,10,1.1)
    return
  }
  if(kind==='follow'){
    boop()
    C.boop=1.2
    burst('heart',6,12,1.4)
    setMode('vibe')
    return
  }
  const tier=giftTier(Number(frame.value)||0)
  boop()
  C.boop=1.2
  burst('heart',tier.hearts,12,1.4)
  if(tier.stars)burst('star',tier.stars,16,1.6)
  // Read by the jump timeline when it launches, so a large gift actually leaves the
  // ground higher instead of only throwing more particles.
  C.jumpBoost=tier.boost
  setMode('jump')
}

function connectChat(){
  if(!roomId)return
  const base=BASE.replace(/^http/,'ws')
  const url=base+'/ws/overlay/'+encodeURIComponent(roomId)
  chatSocket=new WebSocket(url)
  chatSocket.onopen=()=>console.log('[cat] chat connected')
  chatSocket.onmessage=(event)=>{
    try{
      const frame=JSON.parse(event.data)
      if(frame.type==='config'&&frame.config){
        applyCatStyle(frame.config)
        if(catPreview)applyCatStyle(catPreview)
      } else if(frame.type==='status'){
        // Sent on attach and on every edge, so an overlay opened after the stream
        // ended sleeps immediately rather than waiting out IDLE_SLEEP_MS.
        applyStatus(frame)
      } else if(frame.type==='comment'&&frame.text){
        // Comments do not show a bubble — they just make the cat react (hearts).
        if(offline)return
        wake()
        C.boop=1.2
        for(let i=0;i<6;i++)em('heart',C.x+rnd(-10,10),backY()-4,rnd(-8,8),rnd(-30,-18),1.2)
      } else if(frame.type==='gift'||frame.type==='like'||frame.type==='follow'||frame.type==='subscription'){
        // A membership goes through `react` with the rest of the paid events.
        // YouTube emits `subscription` where TikTok emits `gift`, so leaving it
        // off the list made a membership invisible on the cat overlay — the one
        // event a streamer most wants acknowledged. It carries no `value`, so
        // `react` sees tier 0 and gives the small reaction a follow gets.
        react(frame)
      }
    }catch(e){}
  }
  chatSocket.onclose=()=>{setTimeout(connectChat,3000)}
  chatSocket.onerror=()=>{try{chatSocket.close()}catch(e){}}
}
if(roomId)connectChat()

// ---- kucing pixel (dari file asli) ----
const cv=document.getElementById('c'),g=cv.getContext('2d'),ui=document.getElementById('ui')
const bc=document.createElement('canvas');bc.width=96;bc.height=96;const b=bc.getContext('2d',{willReadFrequently:true})
const sc=document.createElement('canvas');sc.width=96;sc.height=96;const sx=sc.getContext('2d')
let X=b,W,H,w,h,PS,GY,mx=-1e4,TT=0,pal='hitam',chonk=false,auto=true,bgm=q.get('bg')==='hijau'?'hijau':'kotak'
const OL='#2b1f2d',lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v))
// Each palette is a ramp, dark to light: `s` stripe, `lo` shadow, `d` far-side mid,
// `b` body, `hi` highlight, then the two light materials.
//
// The ramp is the whole point. These used to be five flat colours and the highlight was
// `mixc`, which lerped 40% toward white — so every palette shaded by *desaturating*:
// orange lost 28 points of saturation on its highlight, the black cat lost 15, and the
// hue never moved anywhere. That is how flat vector art shades. Pixel art on a
// restricted palette shades by moving hue: shadows go cool toward blue and violet,
// highlights go warm toward yellow. The hue column below is monotonic in every palette,
// and saturation rises into the highlight instead of collapsing, which is what makes
// the same three tones read as a machine with a fixed palette rather than a gradient.
// The ramps are dark to light: `s` stripe, `lo` shadow, `d` far-side mid, `b` body,
// `hi` highlight, `belly`, then `ear`. Every shade went up a step from the first draft:
// `lo` at value 22% against an outline at 17% left the body's lower half as one
// undifferentiated black mass, and the belly used as the paw pads was value 75% sitting
// on a value 46% leg, so the front paws read as two bright blocks dropped next to the cat
// rather than as feet.
const PAL={
  oren :{s:'#7a3410',lo:'#b8571a',d:'#cd6a22',b:'#e8813a',hi:'#ffc169',belly:'#fadfae',ear:'#f4737f',paw:'#f0c98d'},
  abu  :{s:'#333d4d',lo:'#59647a',d:'#6f7b93',b:'#8490a8',hi:'#c9d6e8',belly:'#e9eef6',ear:'#f2909f',paw:'#c6d1e0'},
  // Black. The body sits at value 26% and the whole ramp spans 51 points of value, because
  // that is how much value a black cat has: almost none. The previous two attempts both
  // got this wrong in opposite directions - a value-46% body with a value-46% highlight
  // never read as black at all, and a 57%-saturation blue rim at 19% of the sprite read as
  // a blue cat, because blue outweighs its own value by a long way and the eye weighs hue
  // before it weighs brightness.
  //
  // So: small value range, and a highlight that is desaturated (35%) and pale enough to
  // read as light rather than as a colour. The hue shift is still there - shadow at 253,
  // rim at 227 - but it is carried by a thin rim rather than by large fields, which is what
  // moonlight on black fur actually looks like.
  hitam:{s:'#0f0d16',lo:'#191527',d:'#221d33',b:'#2c2542',hi:'#6e7ba8',belly:'#3a3255',paw:'#332c4b',ear:'#c04a72'},
  // White fur. The ramp used to shade warm — an orange stripe (`#d99a5c`) and tan shadows
  // over a cream body (`#f6eddc`) — which is how a *colour* shades, and it is why this
  // palette read as beige rather than white. A white cat has almost no colour to move
  // toward, so the hue shift goes cool instead: every shade is a desaturated blue-grey,
  // the body sits near white, and only the highlight and belly are pure `#ffffff`.
  putih:{s:'#aab3c8',lo:'#c6cddd',d:'#dfe3ee',b:'#f3f5fa',hi:'#ffffff',belly:'#ffffff',ear:'#f7a3ae',paw:'#e4e8f2'},
}
// A palette name only counts once `PAL` exists to check it against, and only when it
// is an own key: `PAL['__proto__']` is truthy because it is inherited, and a palette
// of `Object.prototype` has no `hi`, so the first frame would crash on it.
function safePal(v){return typeof v==='string'&&Object.hasOwn(PAL,v)?v:null}
const qPal=safePal(q.get('pal'));if(qPal)pal=qPal
if(q.get('chonk')==='1'||q.get('chonk')==='true')chonk=true
// Styling pushed by the dashboard — a saved room config, or an unsaved edit in the
// builder preview. Only the two fields this page reads are taken.
let catPreview=null
let palSel=null
function applyCatStyle(style){
  if(!style||typeof style!=='object')return
  const p=safePal(style.pal);if(p){pal=p;if(palSel)palSel.value=p}
  if(typeof style.chonk==='boolean')chonk=style.chonk
}
addEventListener('message',e=>{
  const s=e.data&&e.data.streamkitPreviewStyle
  if(!s)return
  catPreview=s
  applyCatStyle(s)
})
// 4x4 ordered dither, indexed y*4+x. Not the pattern that matters — where it is applied,
// and how narrowly, that does.
//
// The first version dithered the whole of every band, because the threshold was added
// to the lighting value as a perturbation and the threshold spans the same 0..1 the
// lighting value does. It was not a perturbation at all: it dominated the input, gave
// 6% highlight / 19% mid / 76% shadow, and on a 30x24 head turned each boundary into
// about four rows of checkerboard straight across the eyes.
//
// Quantising instead of perturbing fixes the balance. But quantising to thirds and
// scattering the whole band still dithers the entire band, which on a shape this small
// is noise rather than texture. So the dither is a narrow window at each boundary and
// the rest of each band is solid. `DITHER` is that window as a fraction of a band:
// 1 is the old behaviour, 0.3 leaves a one-to-two pixel transition on the head and keeps
// the body reading as three flat tones, which is where the retro look actually comes
// from — the ramp and the hue shift, not the checkerboard.
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5]
const DITHER=.3
const R=(x,y,a,c2,col)=>{if(a<=0||c2<=0)return;X.fillStyle=col;X.fillRect(Math.round(x),Math.round(y),Math.round(a),Math.round(c2))}
// `sh` is a palette: with one, the ellipse is lit and quantised into that palette's
// highlight / body / shadow. Without one it stays a flat fill, which is what the small
// shapes — muzzle, cheek, bubble — still want.
//
// `rim` shapes the lit share of the whole ellipse, because a third is right for a body and
// wrong for a head. Each ellipse lights itself, so at `rim` of 1 a 30x24 head is a third
// highlight — mostly lit, and a black cat with a mostly-lit head is a bright blue blob.
// Below 1 the curve compresses the dark end and the highlight collapses to a rim along the
// upper-left edge, which is how fur catches light. The body passes nothing and keeps the
// even thirds.
function E(cx,cy,rx,ry,col,o,sh,rim){
  cx=Math.round(cx);cy=Math.round(cy)
  if(o)E(cx,cy,rx+1,ry+1,OL)
  for(let y=-ry;y<=ry;y++){
    const t=y/Math.max(ry,.5),hw=Math.round(rx*Math.sqrt(Math.max(0,1-t*t)))
    if(!sh){R(cx-hw,cy+y,hw*2+1,1,col);continue}
    for(let x=-hw;x<=hw;x++){
      // 0 at the lit upper-left edge, 1 at the shaded lower-right one.
      let d=cl((x/Math.max(rx,.5)+y/Math.max(ry,.5))*.5+.5,0,1)
      if(rim)d=Math.pow(d,rim)
      // Thirds, shifted so the dither window sits on the boundary and the solid part of
      // each band dominates. The +DITHER/2 is the bias that window would otherwise add.
      const q=d*3-.5+DITHER/2,i=Math.floor(q),f=q-i
      const z=(f-(1-DITHER))/DITHER
      const up=(BAYER[(((cy+y)&3)<<2)|((cx+x)&3)]+.5)/16<z?1:0
      R(cx+x,cy+y,1,1,[sh.hi,sh.b,sh.lo][cl(i+up,0,2)])
    }
  }
}
function L(x1,y1,x2,y2,t,col,o){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1),1);for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;R(x-t/2-o,y-t/2-o,t+2*o,t+2*o,col)}}
function tri(cx,by,hh,ww,sl,col,o){for(let i=-o;i<=hh+o;i++){const a=Math.max(0,Math.round(ww*(1-i/(hh+1))))+2*o;R(cx+sl*i/hh-a/2,by-i,a,1,col)}}
function spr(a,x,y,col){X=g;a.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='1')R(x+i,y+j,1,1,col)})}
const SP={heart:[['.11.11.','1111111','1111111','.11111.','..111..','...1...'],'#ff4d6d'],z:[['1111','..1.','.1..','1111'],'#8fb8ff'],note:[['..111','..1.1','..1..','.11..','111..'],'#7b6cff'],star:[['..1..','..1..','11111','.111.','11.11'],'#ffd84a']}
function rs(){W=innerWidth;H=innerHeight;const off=clean||root.classList.contains('hide')?30:(W<600?190:120);PS=cl(Math.round(Math.min(W/190,(H-off)/80)),3,10);w=Math.ceil(W/PS);h=Math.ceil(H/PS);cv.width=w;cv.height=h;cv.style.width=w*PS+'px';cv.style.height=h*PS+'px';g.imageSmoothingEnabled=false;GY=h-Math.ceil(off/PS)-2}
function setBg(){const s=document.body.style;if(clean&&bgm!=='hijau'){s.background='transparent';return}
s.background={kotak:'conic-gradient(#0000 25%,#8882 0 50%,#0000 0 75%,#8882 0) 0 0/28px 28px,var(--bg)',hijau:'#00b140',gelap:'#15121b',terang:'#fff'}[bgm]}
const M={
idle:{d:[1,2],T:{}},
walk:{d:[3,6],T:{amp:.7},v:17},
sit:{d:[3,5],T:{sit:1}},
sleep:{d:[5,8],T:{loaf:1}},
vibe:{d:[4,6],T:{sit:1,gl:1}},
stare:{d:[3,4],T:{sit:1}},
flop:{d:[3.5,4.5],T:{amp:.5,fl:1}},
// `once` modes keep running with auto off, so a button press still shows the animation.
// A jump is crouch + launch + flight + settle: the crouch alone is CRUNCH_T, and the
// flight is 2*JUMP_V/GRAV. At 1.2s the old duration cut the flight in half, so the cat
// landed and then stood in a jump pose for the rest of the mode.
jump:{d:[1.2,1.2],T:{},v:22,once:1},
dizzy:{d:[2.2,2.2],T:{sit:1},once:1},
yawn:{d:[1.8,1.8],T:{sit:1},once:1},
wash:{d:[3,4],T:{sit:1,wash:1}},
// A scratch is `wash` with the paw aimed at the ear instead of the muzzle, so it reuses
// the raised-front-leg machinery and only needs its own target and clock.
scratch:{d:[2.5,3.5],T:{sit:1,scratch:1}},
blep:{d:[2,3],T:{sit:1,blep:1}},
sneeze:{d:[1.4,1.4],T:{sit:1,sneeze:1},once:1}}
const WT=[['walk',5],['sit',2],['sleep',1.5],['flop',1.5],['vibe',1.5],['stare',1.5],['jump',1.5],['yawn',1],['wash',1.5],['scratch',1.2],['blep',1],['sneeze',.8],['idle',1]]
// A jump apex of JUMP_V²/(2*GRAV) ≈ 22px, against a ~48px standing body: a soft hop,
// not a launch. 180 was 50px — too high, the cat left the frame on every gift.
const GRAV=320,JUMP_V=120,CRUNCH_T=.3,APEX=JUMP_V*JUMP_V/(2*GRAV)
// Every pose channel, and the rate each one blends at. `ext` and `trail` exist because
// a jump cannot be authored as static weights — see the jump timeline in upd().
const CH={amp:7,sit:7,loaf:7,ball:7,tuck:16,gl:4,fl:7,wash:9,knead:7,ext:18,trail:14,scratch:9,blep:6,sneeze:8}
const C={x:100,dir:1,mode:'idle',t:0,tm:2,vx:0,roll:0,jy:0,jv:0,ph:0,stridePx:8,boop:0,land:0,land0:0,landT:0,crunch:0,jph:0,turn:0,wall:1,lean:0,ef:0,earT:2,es:1,blink:3,bt:0,pt:0,jumpBoost:1,P:{amp:0,sit:0,loaf:0,ball:0,tuck:0,gl:0,fl:0,wash:0,knead:0,ext:0,trail:0,scratch:0,blep:0,sneeze:0}},pts=[]
function setMode(n){const m=M[n];C.mode=n;C.t=0;C.tm=(!auto&&!m.once)?1e9:rnd(m.d[0],m.d[1])
if(m.v)C.dir=C.x<w*.2?1:C.x>w*.8?-1:(Math.random()<.5?1:-1)
if(n==='jump'){
  C.jph=0;C.crunch=0
  // A boosted jump is in the air longer, and the mode has to outlast the flight or
  // the cat is cut off mid-arc and the next mode blends it back to the ground.
  C.tm=CRUNCH_T+2*JUMP_V*(C.jumpBoost||1)/GRAV+.15
}else{C.crunch=0;C.jumpBoost=1}}
function nextMode(){const m=C.mode;if(!auto)return setMode('idle')
let r=Math.random()*WT.reduce((a,b)=>a+b[1],0);for(const[k,v]of WT){r-=v;if(r<=0&&k!==m)return setMode(k)}setMode('walk')}
// Per-particle physics. Without it a heart keeps its initial velocity for its whole
// life: a burst of eight travelled in eight dead-straight parallel lines, and dust
// floated upward instead of settling. Negative gravity is the float-up hearts want;
// drag is what turns that into a rise that slows to a stop.
const PG={heart:-9,note:-6,star:-3,z:-4,puff:120},PD={heart:1.9,note:1.5,star:1.2,z:1.2,puff:3},PF={heart:8,note:6,star:4,z:2,puff:0}
function em(t,x,y,vx,vy,l,sz){pts.push({t,x,y,vx,vy,l,L:l,sz,g:PG[t]||0,dr:PD[t]||0,fl:PF[t]||0,ph:rnd(0,6.28)})}
function boop(){if(offline)return;wake();C.boop=1.2;for(let i=0;i<6;i++)em('heart',C.x+rnd(-10,10),backY()-4,rnd(-8,8),rnd(-30,-18),1.2);if(C.mode==='sleep')setMode('sit');if(C.jy<=0){C.jv=115;C.crunch=Math.max(C.crunch,.45)}}
function upd(dt){const c=C,m=M[c.mode],P=c.P;c.t+=dt;TT+=dt
// Idle → sleepy: after IDLE_SLEEP_MS with no events, put the cat to sleep, and keep it
// there. Setting the mode once was not enough — the sleep mode has a finite duration like
// any other, so `nextMode()` woke the cat the moment it elapsed and the next frame put it
// straight back, a visible flinch every few seconds. The timer is pushed past any mode's
// reach while idle, so sleep lasts until something actually happens.
// Offline beats every other reason to be awake, including the toolbar: a button
