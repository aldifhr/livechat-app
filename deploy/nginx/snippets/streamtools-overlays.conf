# The overlay pages, one URL each so a customiser can point at exactly one of
# them. Served from disk rather than through the Next app: OBS loads them as a
# canvas-sized browser source where a framework runtime is dead weight, and they
# have to keep working while the dashboard is restarting.
#
# frame-ancestors is explicit rather than relying on the global SAMEORIGIN: it
# says the dashboard is meant to frame these, instead of that being true by
# accident because both happen to be on one host today.
add_header Content-Security-Policy "frame-ancestors https://streamtools.aldifhr.my.id" always;

# Bare /overlay redirects rather than 404s: the old address is what older links
# in a streamer's scene collection still point at, and a redirect keeps those
# working instead of leaving a dead browser source on someone's canvas.
location = /overlay { return 302 /overlay/chat-overlay; }
location = /overlay/ { return 302 /overlay/chat-overlay; }
location = /topchatter { return 302 /overlay/top-chatter; }
location = /topchatter/ { return 302 /overlay/top-chatter; }

# The trailing-slash variants are served because a pasted URL will not always
# have one, and a 404 here is a black rectangle in OBS rather than an error
# anyone reads.
# A rewrite, not an alias: with `location = /overlay/chat-overlay/` nginx looks
# for the directory alias/overlay/chat-overlay/ and finds none, so the trailing
# slash answered 500. Rewriting both spellings to one file keeps a pasted URL
# working either way.
location = /overlay/chat-overlay  { rewrite ^ /overlay/chat-overlay.html break; }
location = /overlay/chat-overlay/ { rewrite ^ /overlay/chat-overlay.html break; }
location = /overlay/cat-overlay   { rewrite ^ /overlay/cat-overlay.html break; }
location = /overlay/cat-overlay/  { rewrite ^ /overlay/cat-overlay.html break; }
location = /overlay/ghost-overlay  { rewrite ^ /overlay/ghost-overlay.html break; }
location = /overlay/ghost-overlay/ { rewrite ^ /overlay/ghost-overlay.html break; }

# And the files themselves, addressable under their real names.
location ~ ^/overlay/(chat-overlay|cat-overlay|ghost-overlay)\.html$ {
    root /var/www/streamtools;
}
