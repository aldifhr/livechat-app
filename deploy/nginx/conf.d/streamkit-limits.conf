# Rate limits for the dashboard's sign-in.
#
# Kept in its own file rather than in nginx.conf so it is tracked with the rest
# of this site's config and cannot drift from the vhost that uses it.
#
# `general` (10r/s, in nginx.conf) is the wrong instrument for a password form:
# bcrypt at cost 10 is ~83ms per verify, so ten guesses a second is a thousand
# minutes of CPU a minute, and it was defined but never applied to any location
# anyway. A sign-in is a rare event — a streamer does it once — so the budget is
# per minute, not per second.
#
# `burst` absorbs an honest fumble (typo, then the right password) without
# letting a script through: the queue drains at one request every six seconds.
# `nodelay` makes a burst within the allowance answer immediately rather than
# being paced, which is what a human expects from a form.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# 429, not the 503 default. A throttled sign-in is "too many requests", and the
# login page can tell the user that; a 503 reads as "the server is broken".
limit_req_status 429;

# --- the two unauthenticated routes an overlay makes itself -----------------
#
# Both are open on purpose: OBS cannot present a credential, and an overlay that
# asked for one would show a password box on stream. Neither is open without a
# ceiling, though, and the ceilings have to be per IP — the backend sees one
# process and one global cap, so "how many" is a question only the edge can
# answer.

# Sockets, not requests. `/ws/` is unauthenticated and `room_id` is free-form,
# so the only thing standing between an open port and a process out of file
# descriptors was the hub's global cap of 200 (5 per room). Forty made-up room
# ids at five sockets each filled it, and every real overlay was then refused
# with 1013 — a stream that goes blank because someone else ran a loop.
#
# 20 per IP is well clear of a real setup: one streamer's OBS carries a handful
# of overlays, and a dashboard preview one more. Raising it is a one-line edit
# here; the point is that exhausting the global cap now costs an attacker an
# address per twenty sockets rather than none at all.
limit_conn_zone $binary_remote_addr zone=wsconn:10m;
# 429 rather than the 503 default, for the same reason as above: a refused
# upgrade is "too many", and the overlay page can say so.
limit_conn_status 429;

# Requests to the auto-room route. It creates a room for any handle it is given,
# up to a global ceiling of 20 auto-created rooms — so a script working through
# random handles does not exhaust the backend, it exhausts the *quota*, and every
# real streamer who then tries to connect gets a 429 until someone deletes rooms
# by hand. This does not make that impossible; it makes it cost 2/s per address
# instead of being free, which is the difference between a script that runs for
# six seconds and one that has to be worth running.
limit_req_zone $binary_remote_addr zone=autoroom:10m rate=2r/s;

# --- the socket log, without the query string --------------------------------
#
# An overlay token travels in the query string, because that is the only place a
# browser can put a value on a WebSocket handshake: `Sec-WebSocket-Protocol` is
# the one header a page may set, and every client already uses it for nothing.
# The backend scrubs the value out of its own logs (see `api/wsguard.py`), and
# this is the other half of that — the edge's access log.
#
# `combined` builds its request field from `$request`, which is the whole request
# line: method, path, *query*, protocol. So a token in a URL lands in
# `/var/log/nginx/access.log` in cleartext, world-readable to anything that can
# read the log, and the log is the one copy nobody thinks to rotate a secret out
# of. This format is `combined` with the request line rebuilt from `$uri`, which
# is the normalised path and carries no query string.
#
# Everything else is kept identical — same fields, same order, same spacing — so
# a log parser reading `combined` reads this without a change, and the only
# difference in the output is that the query is gone.
#
# Applied to `/ws/` only, in the vhost. The rest of the surface keeps `combined`:
# nothing else puts a credential in a URL, and a log format that silently drops
# the query everywhere would take the useful part of a request line with it.
log_format streamkit_ws '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
