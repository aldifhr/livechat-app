# Every suite in the repo, on every push.
#
# There was no CI at all, which made "everything is green" a claim about whoever
# last remembered to run it. Three parts build from three directories with three
# different toolchains and no root manifest between them, so they are three jobs:
# one failure should not hide the other two, and each is a few minutes rather
# than one queue behind a Tauri build.
#
# What is NOT here, and why:
#   - `scripts/deploy-web.sh` and `api/tests` touching a real store. The
#     backend suites point `STREAMKIT_CONFIG_DIR` at a temp dir each, so they
#     cannot reach `api/config/rooms.json`.
#   - Any secret. Nothing in any suite reads one; the token gates are exercised
#     by setting `STREAMKIT_TOKEN` in the test's own env.
#   - A build of the installer. Releases stay a deliberate, human action.
#
# The desktop app and its Rust crate were removed; the two jobs that built them
# went with them. `shared/` stayed, because the dashboard imports it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes, so a branch with
# five commits does not queue five full builds behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api:
    name: backend (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned, not `latest`: the backend targets 3.12, and a runner that
          # quietly moves to 3.14 turns a passing suite into a failing one for
          # reasons that have nothing to do with the change under test.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      # The runner, not pytest: there is no pytest here. It starts each suite in
      # its own subprocess with its own `STREAMKIT_CONFIG_DIR`, and checks the
      # count against the files on disk so a stray test cannot silently not run.
      - run: python tests/run_all.py
