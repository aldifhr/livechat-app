<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top chatters overlay</title>
<!--
  One file, on purpose — the same rule the chat overlay follows.

  This page is a standalone source for OBS: it shows only the leaderboard, the
  chattiest viewers of the session, so it can sit in its own scene beside the chat
  overlay rather than sharing one rectangle with it. It talks to the very same
  StreamKit backend and the very same websocket the chat overlay does, and asks
  for the ranking the same way — a `topChatters` request, answered back to this
  socket only. Nothing here is new on the wire; it is a second view of a board the
  backend already keeps.

  What it deliberately does not do is show chat. That is the whole point: a stream
  that wants "who is talking most" as its own graphic, not as a corner of the chat.
  It also does not talk to the desktop app — it resolves the handle itself and
  opens its own socket, exactly like the chat overlay, so it works whether or not
  the app is running.

  Do not add a second copy. The backend serves this file over HTTP and the desktop
  host would embed it with include_str! if it used it; keep it here so there is one
  source of truth.
-->
<style>
  :root {
    /* Replaced from the query string, each with a default so a bare URL renders. */
    --size: 28px;
    --name-colour: #ffd76a;
    --text-colour: #ffffff;
    --background: 0.35;
    --font: "Segoe UI", system-ui, sans-serif;
    --align: flex-start;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    /* OBS composites the source, so the page must not have an opaque body of its
       own or the video behind it disappears. */
    overflow: hidden;
  }

  /* A backdrop, for when this page is being *shown* rather than composited.
     `html` and `body` are transparent on purpose — this page is drawn over video,
     and in OBS the pixels behind it are the scene. A browser paints an opaque
     base behind a transparent document regardless, so on its own this page in a
     preview frame is a white rectangle with light text on it: precisely the
     combination the colours are picked to be legible against.
     `?backdrop=dark` puts something there. It is opt-in per request, so the OBS
     browser source — which is asked for this page with no such parameter, and
     must stay transparent — is unaffected. */
  html.stage-backdrop { background: #141414; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: var(--align);
    /* Centred horizontally so the title and the list sit in the middle of the
       frame the way a centred graphic does; align-items: stretch would pin the
       panel to the left edge. */
    align-items: center;
    /* In `em`, as on the chat overlay: 24px is a hair's breadth on a 1080p source
       and a visible border on a 720p one, and the canvas is a fixed number of
       pixels while the text is not. */
    padding: 1em;
    font-family: var(--font);
    font-size: var(--size);
    line-height: 1.3;
  }

  /* The whole leaderboard is one gray panel: a title centred across the top and
     the ranking beneath it. A single card rather than per-row scrims, because a
     leaderboard is one graphic — "the board" — and ten separate dark bars read as
     ten things rather than one. The panel hugs its content and grows downward from
     its aligned edge, so it does not stretch across a canvas it does not fill. */
  #panel {
    width: fit-content;
    max-width: 100%;
    background: rgba(110, 110, 110, var(--background));
    border-radius: 12px;
    padding: 0.7em 1em;
  }

  #caption {
    color: var(--name-colour);
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.72em;
    margin: 0 0 0.5em 0;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }

  #board {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
  }

  #board li {
    display: flex;
    align-items: baseline;
    gap: 0.6em;
    padding: 0.15em 0.1em;
    color: var(--text-colour);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }

  #board li + li {
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }

  .board-rank {
    color: var(--name-colour);
    font-weight: 800;
    min-width: 1.4em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .board-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .board-count {
    color: var(--name-colour);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  /* The one failure worth saying out loud: a wrong link. Unlike everything else,
     this is not a connection that might recover — it is a URL that will never
     work, and a streamer testing it before going live is looking at a blank
     rectangle with no way to tell it from a working source that has seen nothing
     yet. */
  #unconfigured {
    display: none;
    color: var(--text-colour);
    font-size: 0.7em;
    opacity: 0.9;
  }
  body.unconfigured #unconfigured { display: block; }

  /* Only ever visible under ?debug=1. The failure mode of an overlay is silence,
     and a status line burned into a stream is worse than no diagnosis at all. */
  #status {
    display: none;
    position: fixed;
    left: 8px;
    bottom: 6px;
    color: #8f8;
    font-size: 12px;
    opacity: 0.6;
  }
  body.debug #status { display: block; }
</style>
</head>
<body>
<div id="panel" hidden>
  <p id="caption"></p>
  <ol id="board" aria-live="polite"></ol>
</div>
<div id="unconfigured">no handle in this link — add <code>?room=yourhandle</code></div>
<div id="status"></div>

<!-- Baked in by the host at request time. Must come before the script that reads
     it, because that script parses it the moment it runs. -->
<script id="overlay-config" type="application/json">__OVERLAY_CONFIG__</script>

<script>
(function () {
  'use strict'

  // ---- configuration -------------------------------------------------------

  // Baked in by the host at request time; the query string wins over it, so a
  // bare `?room=<id>` link renders the configured board and a hand-edited link
  // still works. Same contract as the chat overlay.
  var baked = (function () {
    try { return JSON.parse(document.getElementById('overlay-config').textContent) || {} }
    catch (e) { return {} }
  })()

  var query = new URLSearchParams(location.search)

  function param(name, fallback) {
    var found = query.get(name)
    return found === null || found === '' ? fallback : found
  }

  function number(name, fallback, min, max) {
    var given = param(name, '')
    // An absent parameter is not a number and must fall back, not clamp. The trap
    // is `Number('') === 0`: 0 is finite, so an isFinite check alone passes it and
    // then clamps up to min. Empty is treated as absent before it is ever a number.
    if (given === '') return fallback
    var raw = Number(given)
    if (!isFinite(raw)) return fallback
    return Math.min(max, Math.max(min, raw))
  }

  // The heading's own bound, mirrored here so the page decides for itself rather
  // than trusting the link. 40 characters is one line in a panel sized for one.
  function resolveTitle(value) {
    var text = String(value == null ? '' : value).trim()
    return text === '' || text.length > 40 ? 'Top Yapping' : text
  }

  var config = {
    // Defaults to this page's own origin. The page and its websocket are served
    // by the same vhost, so an overlay link names one host and nothing has to be
    // rewritten to work; `base` is still honoured for a page hosted elsewhere.
    baseUrl: String(param('base', baked.baseUrl || location.origin)).replace(/\/+$/, ''),
    username: String(param('room', baked.username || '')).replace(/^@/, '').trim(),
    size: number('size', typeof baked.size === 'number' ? baked.size : 36, 8, 96),
    nameColour: param('name', baked.nameColour || '#ffd76a'),
    textColour: param('color', baked.textColour || '#ffffff'),
    // How opaque the gray panel is. Defaults high now that it is a card
    // rather than a per-row scrim: a leaderboard panel should read as a panel.
    background: number('bg', typeof baked.background === 'number' ? baked.background : 0.9, 0, 1),
    // How many chatters to show. Ten is the ranking the backend keeps; asking for
    // more than it has simply shows all of them.
    max: Math.round(number('max', typeof baked.max === 'number' ? baked.max : 10, 1, 50)),
    font: param('font', baked.font || '"Segoe UI", system-ui, sans-serif'),
    // Seconds between ranking refreshes. A ranking changes slowly; five seconds is
    // current enough and cheap. Pushed as `poll` rather than a fixed beat so a
    // busy stream can tighten it without a redeploy.
    poll: number('poll', 5, 2, 60) * 1000,
    align: param('align', 'top'),
    debug: param('debug', '') !== '',
    // The heading above the ranking. Read from the link rather than baked into
    // the page, so a streamer calls their board whatever fits the channel. A
    // blank or an overlong value falls back to the default rather than being
    // cut mid-word, so the heading is always a complete title.
    title: resolveTitle(param('title', baked.title || 'Top Yapping'))
  }

  // This page's own styling defaults, with no URL and no baked config involved.
  //
  // Needed because a pushed style is the room's *whole* style rather than a patch,
  // so a key the push leaves out means "back to default" — not "keep whatever it
  // was". Without this, clearing a room's saved styling left the board on the old
  // values. `poll` is not in here: it is not styling, and a restyle should not
  // change how often the ranking refreshes.
  var STYLE_DEFAULTS = {
    // 36, not the 28 this was raised from. The size was fixed once already, and
    // only in half the places: the `config` literal below and `shared/overlay.ts`
    // moved to 36 while this copy stayed at 28, so a board opened at 36 dropped to
    // 28 — 1.5% of a 1920px canvas — the first time the backend pushed a style for
    // a room with no saved `size`. That is the regression, returned by the path the
    // original fix did not cover. `test-overlay-sync.mjs` now compares this object
    // against the load default as well as against the shared module, because a
    // check that only reads one of the two copies cannot see the other one drift.
    size: 36,
    nameColour: '#ffd76a',
    textColour: '#ffffff',
    background: 0.9,
    max: 10,
    font: '"Segoe UI", system-ui, sans-serif',
    align: 'top',
    title: 'Top Yapping'
  }

  // Push the current styling onto the page.
  //
  // A function rather than a run of statements at load because it runs again every
  // time the backend pushes a new style for this room. Everything it touches is a
  // custom property the rules already read, plus one text node — so a restyle does
  // not rebuild the board, does not reconnect, and does not interrupt the polling
  // that keeps the ranking fresh.
  function applyConfig() {
    document.documentElement.style.setProperty('--size', config.size + 'px')
    document.documentElement.style.setProperty('--name-colour', config.nameColour)
    document.documentElement.style.setProperty('--text-colour', config.textColour)
    document.documentElement.style.setProperty('--background', String(config.background))
    document.documentElement.style.setProperty('--font', config.font)
    // `top` grows the board downward from the top of the frame (a scoreboard);
    // `bottom` pins it to the bottom. Anything else is top, rather than a value the
    // flex model would silently ignore.
    document.documentElement.style.setProperty(
      '--align',
      config.align === 'bottom' ? 'flex-end' : 'flex-start'
    )
    // As text, never markup: it comes from a query string the operator controls but
    // which is still a string on the wire.
    document.getElementById('caption').textContent = config.title
  }

  applyConfig()

  var status = document.getElementById('status')
  function say(message) {
    if (config.debug) status.textContent = message
  }

  // ---- the board -----------------------------------------------------------

  var panel = document.getElementById('panel')
  var board = document.getElementById('board')

  /**
   * Reports the rendered height of the board to whoever embedded this page.
   *
   * The overlay itself is a fixed rectangle in OBS — that is what a browser
   * source IS — and its own `overflow: hidden` is deliberate there: content that
   * does not fit is content the operator chose not to size the source for.
   *
   * The dashboard's preview is a different thing. It has no size of its own to
   * honour; it is a window onto this page, and when it is shorter than the board
   * it clips the bottom rows with no scrollbar and no error. A ten-row board in
   * a 520px window reads as a broken overlay rather than as a frame that is
   * simply too small, and the operator has no way to tell the difference.
   *
   * So the height is reported and the preview grows to it. Measured only while
   * the panel is shown, because a `hidden` element has no box to measure.
   * Silently ignored when nothing is listening — OBS does not read it, and a page
   * must not crash posting into a void.
   */
  // A backdrop is asked for, not taken. See the `stage-backdrop` rule: this page
  // is composited over video in OBS and has to stay transparent there, and a
  // preview frame cannot provide the video — so it asks for a stand-in instead.
  if (param('backdrop', '') === 'dark') {
    document.documentElement.classList.add('stage-backdrop')
  }

  function reportHeight() {
    if (panel.hidden) return
    try {
      // `scrollHeight` is the body's content box; the body's own 24px padding is
      // outside it, so it is added back or the last row sits on the very edge of
      // a frame that is exactly tall enough.
      parent.postMessage({ streamkitHeight: document.body.scrollHeight + 48 }, '*')
    } catch (error) {}
  }

  new ResizeObserver(reportHeight).observe(document.body)
  window.addEventListener('load', reportHeight)

  /**
   * Draws the leaderboard: the chattiest viewers, most messages first.
   *
   * Rebuilt each poll rather than diffed — ten rows on a slow beat is cheaper to
   * redraw than to keep in place. Names go in as text, never markup, because a
   * nickname is user input rendered on a stream. The board and its caption are
   * hidden until the first ranking arrives, so an overlay for a room nobody has
   * talked in yet reserves no space for an empty box.
   */
  function renderBoard(chatters) {
    // The panel hides as one unit — title and list together — so a room nobody
    // has talked in yet reserves no space rather than showing an empty gray card
    // with a heading and nothing under it.
    if (!chatters || chatters.length === 0) {
      panel.hidden = true
      return
    }
    panel.hidden = false
    board.textContent = ''
    for (var i = 0; i < chatters.length; i++) {
      var c = chatters[i]
      var row = document.createElement('li')

      var rank = document.createElement('span')
      rank.className = 'board-rank'
      rank.textContent = String(i + 1)
      row.appendChild(rank)

      var name = document.createElement('span')
      name.className = 'board-name'
      name.textContent = String(c.nickname || c.id || 'Someone')
      row.appendChild(name)

      var count = document.createElement('span')
      count.className = 'board-count'
      count.textContent = String(c.messages || 0)
      row.appendChild(count)

      board.appendChild(row)
    }
    // After the rows are in, so the measurement includes them.
    reportHeight()
  }

  // ---- the connection ------------------------------------------------------

  // The same two steps the chat overlay takes: name a handle, get a room id. The
  // board reads the identical `topChatters` frame the chat overlay already knows,
  // so this is a second view of a board the backend keeps, not a new feature on
  // the wire.
  function socketFor(base, roomId) {
    var url = base.replace(/^http/, 'ws') + '/ws/overlay/' + encodeURIComponent(roomId)
    return new WebSocket(url)
  }

  // A room id, recognised by shape — eight, four, four, four, twelve hex digits
  // with dashes — because the backend mints ids in exactly that form and a handle
  // can never contain a dash-run like it. Passing one straight through skips the
  // resolve step.
  function looksLikeRoomId(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value)
  }

  var socket = null
  var pollTimer = null

  function pollBoard() {
    try {
      socket.send(JSON.stringify({ type: 'topChatters' }))
    } catch (error) {
      // A socket mid-close throws on send; the close handler reconnects and the
      // next open schedules the poll again.
    }
  }

  function open(roomId) {
    document.body.classList.remove('unconfigured')
    try {
      socket = socketFor(config.baseUrl, roomId)
    } catch (error) {
      say('bad backend URL: ' + error.message)
      setTimeout(connect, 5000)
      return
    }

    socket.onopen = function () {
      say('connected to ' + roomId)
      pollBoard()
      pollTimer = setInterval(pollBoard, config.poll)
    }

    socket.onmessage = function (event) {
      var frame
      try {
        frame = JSON.parse(event.data)
      } catch (error) {
        return
      }
      if (!frame) return
      // A new style for this room, pushed the moment it is saved. Merged into the
      // live config rather than replacing it: the frame carries styling only, and
      // `baseUrl` and `username` came from the URL this page was opened with. A
      // replace would take the board offline as soon as somebody nudged a slider.
      if (frame.type === 'config' && frame.config) {
        // Reset first, then apply. The frame is the room's whole style, so a key
        // it does not carry reverts rather than persisting from the last one.
        // A room with no saved styling sends an empty frame. That is not a
        // request to go back to defaults — it is the absence of a request — and
        // acting on it would strip the styling from any link that carried its own
        // parameters, which is what every link did before styling could be saved.
        // Un-styling is done by saving actual defaults, which is what the editor's
        // Reset button does.
        if (Object.keys(frame.config).length === 0) return

        Object.keys(STYLE_DEFAULTS).forEach(function (key) {
          config[key] = STYLE_DEFAULTS[key]
        })
        Object.keys(frame.config).forEach(function (key) {
          if (frame.config[key] !== undefined && frame.config[key] !== null) {
            config[key] = frame.config[key]
          }
        })
        applyConfig()
        say('style updated')
        return
      }
      // The ranking, asked for and answered. Everything else on the wire — chat,
      // gifts, joins, likes, viewer counts — is not a leaderboard and is ignored:
      // this source shows the board and nothing else.
      if (frame.type === 'topChatters') {
        renderBoard(frame.chatters || [])
      }
    }

    socket.onclose = function () {
      clearInterval(pollTimer)
      say('socket closed, retrying')
      setTimeout(connect, 3000)
    }
  }

  function connect() {
    if (config.username === '') {
      document.body.classList.add('unconfigured')
      say('no handle — add ?room=yourhandle to the URL')
      return
    }

    if (looksLikeRoomId(config.username)) {
      open(config.username)
      return
    }

    fetch(config.baseUrl + '/api/room-connect-by-username', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: config.username })
    })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status)
        return response.json()
      })
      .then(function (room) {
        if (!room || !room.room_id) throw new Error('no room id in the answer')
        open(room.room_id)
      })
      .catch(function (error) {
        say('resolve failed: ' + error.message)
        setTimeout(connect, 5000)
      })
  }

  connect()
})()
</script>
</body>
</html>
